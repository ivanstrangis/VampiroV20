function textoLimite(e){
  if(e.diario) return "Se agotó el límite diario del motor. Volvé mañana o elegí otro motor en Menú → Partida.";
  if(e.espera) return "El motor te pidió esperar unos " + e.espera + " segundos (límite por minuto del plan gratis). Tocá «Reintentar» en un momento.";
  return "Llegaste al límite de uso del motor por ahora. Probá de nuevo en un rato.";
}
async function narrar(texto, {oculto=false, reusar=false}={}){
  if(running) return;
  if(!SAMPLE){ sysMsg("No hay un motor del Narrador configurado. Elegilo en Menú → Motor del Narrador.", "err", false); return; }
  if(!reusar){
    if(oculto){ const m = {rol:"jugador", texto, oculto:true, n:nextN()}; MSGS.push(m); guardarMsg(m); }
    else nuevoMsg({rol:"jugador", texto});
  }
  const input = turnos();

  MUNDO.opciones = []; renderChips();
  running = new AbortController();
  setBusy(true);
  const pensando = document.createElement("div"); pensando.className = "thinking"; pensando.textContent = "El Narrador piensa…";
  chat.appendChild(pensando); scrollChat();

  // turno: segmentos de texto intercalados con tarjetas
  let full = "", cortado = 0, bubble = null, segs = [];
  const nuevaBurbuja = () => { bubble = document.createElement("div"); bubble.className = "narr"; bubble.innerHTML = '<div class="lbl">Narrador</div><div class="txt"></div>'; chat.appendChild(bubble); segs.push({el:bubble, texto:""}); };
  turnoActual = {
    cortar(){ cortado = full.length; bubble = null; },
    agregar(m){ pensando.remove(); const r = nuevoMsg(m); return r; }
  };
  try {
    // Si el motor pide esperar (límite por minuto), se avisa en pantalla para que no parezca colgado.
    let esperando = null;
    const opts = {signal:running.signal, cache:false, effort:"low",
      onEspera: s => { if(!esperando){ esperando = document.createElement("div"); esperando.className = "thinking"; chat.appendChild(esperando); }
        esperando.textContent = "El motor pidió esperar unos " + s + " segundos (límite por minuto)…"; scrollChat(); },
      onText: ({text}) => { pensando.remove(); esperando?.remove(); esperando = null; full = text; const seg = text.slice(cortado);
        if(!seg.trim()) return; if(!bubble) nuevaBurbuja(); segs[segs.length-1].texto = seg; bubble.querySelector(".txt").innerHTML = parrafos(seg.trim()); scrollChat(); } };
    const tools = herramientas(); if(tools.length) opts.tools = tools;
    await SAMPLE(input, opts);
  } catch(e){
    pensando.remove();
    const msg = {auth:"El motor rechazó la clave. Revisala en Menú → Motor del Narrador.", red:"No se pudo conectar con el motor del Narrador. Revisá tu conexión o el motor elegido.", json:"El modelo no respondió en el formato esperado.", not_granted:"Para jugar, permití que la página use Claude (lo pide la primera vez).", rate_limited:textoLimite(e),
      session_expired:"Tu sesión de Claude venció. Volvé a iniciar sesión.", cancelled:"Narración detenida.", refused:"El Narrador no pudo responder a eso. Probá describir la acción de otra forma.",
      prompt_too_large:"La partida es demasiado larga para enviarla entera. Avisale al Director para resumir.", tools_unavailable:"Esta vista no permite herramientas: el motor de reglas no puede actuar."}[e.code]
      || "Se cortó la conexión con el Narrador. Tocá «Reintentar».";
    if(!(e.code === "cancelled" && running?.silencioso)) sysMsg(msg, e.code === "cancelled" ? "" : "err", false);
    if(e.code !== "cancelled" && e.code !== "not_granted") MUNDO.opciones = ["Reintentar"];
  } finally {
    guardarTextos(segs); chat.querySelectorAll(".thinking").forEach(x => x.remove());
    running = null; turnoActual = null; setBusy(false); renderChips(); guardarFicha(); refrescarCabecera();
  }
}
// Los textos del Narrador se guardan al terminar el turno. Para que una recarga muestre el mismo
// orden que la pantalla, cada texto recibe un n entre el elemento anterior y el siguiente.
function guardarTextos(segs){
  const usados = new Set(MSGS.map(m => m.n));
  for(const s of segs){
    if(!s.texto.trim()){ s.el.remove(); continue; }
    const hijos = [...chat.children], idx = hijos.indexOf(s.el);
    const prev = hijos.slice(0, idx).reverse().find(h => h.dataset.n);
    let n = prev ? Number(prev.dataset.n) + 0.25 : nextN();
    while(usados.has(n)) n = Math.round((n + 0.01) * 100) / 100;
    usados.add(n);
    const m = {rol:"narrador", texto:s.texto.trim(), n};
    s.el.dataset.n = n; MSGS.push(m); guardarMsg(m);
  }
  MSGS.sort((a,b) => a.n - b.n);
}

}

const FORMATO = "bbn-personaje";
async function exportarPersonaje(){
  if(!F) return;
  const ajena = esHojaAjena();
  const datos = {formato:FORMATO, version:2, exportado:new Date().toISOString(), ficha:F, inventario:INV, conocimiento:CON, notas:NOTAS,
    mundo:MUNDO, director: ajena || (!GUIA?.texto && !GUIA?.premisa) ? null : GUIA, cronica: ajena ? null : CRONICA, cronica_meta: ajena ? null : CRON, mensajes: ajena ? null : await mensajesDe(PJ)};
  const nombre = (norm(F.nombre).replace(/[^a-z0-9_]/g, "").slice(0, 40) || "personaje") + ".json";
  const texto = JSON.stringify(datos, null, 1);
  try {
    if(DESCARGAS){ await DESCARGAS.save({filename:nombre, data:texto}); cerrarSheet(); sysMsg("Archivo exportado. Pasáselo a quien lo tenga que importar.", "rule"); return; }
  } catch(e){ if(e?.code === "declined"){ return; } }
  try {
    const url = URL.createObjectURL(new Blob([texto], {type:"application/json"}));
    const a = document.createElement("a"); a.href = url; a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000); cerrarSheet(); sysMsg("Archivo exportado.", "rule");
  } catch(_){ sysMsg("No se pudo exportar desde esta vista.", "err"); }
}
let importarComoJugador = false;
let importarCron = false;

$("#f-importar").addEventListener("change", async e => {
  const file = e.target.files?.[0]; if(!file) return;
  let d = null;
  try { const txt = file.text ? await file.text() : await new Promise((ok, mal) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = mal; r.readAsText(file); }); d = JSON.parse(txt); } catch(_){}
  if(importarCron){ importarCron = false; return importarCronicaArchivo(d); }
  if(d?.formato === FORMATO_RESPALDO){
    if(!DB){ sysMsg("No se pudo abrir el guardado de este dispositivo.", "err"); return; }
    if(!respaldoValido(d)){ sysMsg("El respaldo está incompleto o dañado.", "err"); return; }
    return confirmarRespaldo(d);
  }
  if(!d || d.formato !== FORMATO || !d.ficha?.atributos){ sysMsg("Ese archivo no es un personaje exportado desde esta app.", "err"); return; }
  if(!DB){ sysMsg("No se pudo abrir el guardado de este dispositivo.", "err"); return; }
  const jug = importarComoJugador;
  const f = {...d.ficha, hoja_de_jugador: jug || undefined, importado:new Date().toISOString()};
  if(!jug) delete f.hoja_de_jugador;
  const id = (norm(f.nombre_real || f.nombre).replace(/[^a-z0-9_]/g,"").slice(0,24) || "pj") + "_" + Date.now().toString(36);
  const mundo = jug ? {modo:"mesa", registro_mesa:d.mundo?.registro_mesa || []} : {...(d.mundo || {modo:"mesa"})};
  if(!jug){ if(d.director) mundo.cronica_id = id; else { delete mundo.cronica_id; mundo.modo = "mesa"; } }
  const docs = [["personajes/"+id, f], ["inventario/"+id, d.inventario || {items:[]}], ["conocimiento/"+id, d.conocimiento || {hechos:[]}],
    ["notas/"+id, d.notas || {texto:""}], ["mundo/"+id, mundo]];
  if(!jug && d.director) docs.push(["director/"+id, d.director], ["cronica/"+id, d.cronica || {noches:[]}],
    ["cronicas/"+id, {nombre:d.cronica_meta?.nombre || "Crónica de " + f.nombre, tipo:d.cronica_meta?.tipo || "libre", idea:d.cronica_meta?.idea || "", creada:new Date().toISOString(), importada:true}]);
  if(!jug && Array.isArray(d.mensajes)) for(const m of d.mensajes) if(m && Number.isFinite(Number(m.n))) docs.push(["mensajes_" + id + "/m" + m.n, m]);
  try { for(const [p, x] of docs) await DB.doc(p).set(JSON.parse(JSON.stringify(x))); }
  catch(e2){ sysMsg("No se pudo importar ("+(e2.code||"error")+").", "err"); return; }
  evento("personaje_importado", {pj:id, nombre:f.nombre, como_jugador:jug});
  await cambiarPersonaje(id);
  sysMsg(jug ? `Hoja de ${f.nombre} abierta. Está en el menú, en «Soy narrador».` : `${f.nombre} importado.`, "rule");
});

// Qué hace cada poder en el juego. Resumen propio del manual V20 (cap. 4).
const DESC_PODER = {
  "Susurros Salvajes":"Hablás con un animal mirándolo a los ojos; no hace falta tirada para charlar. Para darle una orden simple tirás Manipulación + Trato con Animales: dif. 6 con depredadores (perros, gatos, murciélagos), 7 con otros mamíferos y aves rapaces, 8 con pájaros y reptiles.",
  "Llamada":"Imitás la voz de una especie (aullido, graznido) y acuden los animales de esa especie que la oigan. Carisma + Supervivencia dif. 6: con 1 éxito viene uno solo; con más éxitos, una parte cada vez mayor de los que hay cerca. Podés llamar a uno en particular.",
  "Reprimir a la Bestia":"Mirando a un mortal o animal, le apagás las emociones fuertes (miedo, furia, esperanza, amor) y queda apático. Manipulación + Intimidación o + Empatía dif. 7, extendida hasta juntar tantos éxitos como su Fuerza de Voluntad.",
  "Comunión de Espíritus":"Poseés a un animal mirándolo a los ojos y controlás su cuerpo mientras el tuyo queda en trance. Manipulación + Trato con Animales dif. 8; con más éxitos podés usar más Disciplinas desde el animal.",
  "Expulsar a la Bestia":"Descargás tu Frenesí en otra persona a la vista, que entra en Frenesí en tu lugar. Manipulación + Autocontrol dif. 8; con pocos éxitos puede caer en otro o dejarte aturdido.",
  "Sentidos Agudizados":"Vista, oído y olfato al doble de alcance y claridad, sin tirada. Las tiradas con los sentidos (como Percepción + Alerta) bajan su dificultad tantos puntos como tu Auspex, y el Narrador puede avisarte de un peligro. Luces o ruidos fuertes de golpe te pueden aturdir.",
  "Percepción del Aura":"Mirás a alguien unos segundos y ves los colores de su aura: su emoción dominante, si es vampiro, si miente, si cometió diablerie. Percepción + Empatía dif. 8; cada éxito da más detalle.",
  "Toque del Espíritu":"Tocando un objeto ves quién lo usó, cuándo y qué sentía. Percepción + Empatía; la dificultad va de 4 (algo intenso y reciente) a 9 (algo viejo y débil).",
  "Telepatía":"Mandás pensamientos a la mente de alguien o le leés los suyos. Inteligencia + Subterfugio, dificultad = su Fuerza de Voluntad actual; cada éxito saca un dato o una capa más profunda. Con vampiros cuesta además 1 FV.",
  "Proyección Psíquica":"Salís de tu cuerpo como forma astral y viajás muy rápido a cualquier lugar; tu cuerpo queda como en trance. 1 FV y Percepción + Consciencia; la dificultad sube con la distancia.",
  "Pasión":"Hablando con alguien, le subís o bajás una emoción que ya tiene (una molestia se vuelve furia, el amor se vuelve indiferencia). Carisma + Empatía, dificultad = su Humanidad; los éxitos fijan cuánto dura, de un turno a meses.",
  "Tortura Mental":"Tras conversar con la víctima, le hacés ver, oír o sentir cosas que no existen, hasta que duda de su cordura. 1 Sangre y Manipulación + Subterfugio contra su Percepción + Autocontrol; dura de una noche a un año.",
  "Ojos del Caos":"Ves los patrones ocultos en la locura y en el azar: la verdadera Naturaleza de alguien, un mensaje cifrado, una señal en hechos casuales. Percepción + Ocultismo, dif. 6 a 9 según lo complejo.",
  "Voz de Locura":"Hablándole en voz alta a quienes te oyen, los hacés entrar en Frenesí o en pánico ciego. 1 Sangre y Manipulación + Empatía dif. 7: una víctima por éxito. Los vampiros pueden resistir con +2 a la dificultad; los mortales no.",
  "Locura Total":"Con toda la atención de la víctima durante un turno, la volvés loca: le das cinco Trastornos. 1 Sangre y Manipulación + Intimidación, dificultad = su Fuerza de Voluntad actual; dura de un turno a un año.",
  "Orden":"Mirándolo a los ojos, das una orden de una palabra (¡Corré!, ¡Callate!, ¡Soltalo!) y la cumple al instante. Manipulación + Intimidación, dificultad = su Fuerza de Voluntad. No sirve para que se haga daño a sí mismo.",
  "Mesmerismo":"Mirándolo a los ojos, le implantás una sugestión hipnótica, para ahora o para cuando pase algo. Manipulación + Liderazgo, dificultad = su Fuerza de Voluntad; con más éxitos acepta órdenes más extrañas.",
  "Mente Olvidadiza":"Mirándolo a los ojos y haciéndole preguntas, le borrás o le cambiás recuerdos. Astucia + Subterfugio, dificultad = su Fuerza de Voluntad; con más éxitos el cambio es más grande y dura más.",
  "Condicionamiento":"Con semanas de trabajo, volvés a alguien cada vez más obediente a vos y más resistente a otros. Carisma + Liderazgo una vez por escena, extendida; el Narrador decide en secreto cuántos éxitos hacen falta.",
  "Posesión":"Le quebrás la voluntad a un mortal y pasás a ocupar su cuerpo mientras el tuyo queda inerte. 1 FV y Carisma + Intimidación enfrentada a su Fuerza de Voluntad (dif. 7) hasta dejarla en cero. Solo con mortales.",
  "Silencio de la Muerte":"Te rodea un silencio sobrenatural de unos 6 metros: no se oye nada de lo que pasa ahí, ideal para matar sin testigos. 1 Sangre; dura una hora.",
  "Toque de Escorpión":"Convertís tu Sangre en veneno y lo aplicás tocando o en un arma de mano. Por cada Sangre envenenada, la víctima pierde 1 de Resistencia si no lo resiste con Resistencia + Fortaleza. Un mortal en 0 queda enfermo terminal; un vampiro cae en Letargo.",
  "Llamada de Dagón":"Hasta una hora después de tocar a alguien, lo ahogás desde adentro con su propia sangre, aunque no esté a la vista. 1 FV y Resistencia enfrentada; cada éxito es un nivel de daño letal.",
  "Caricia de Baal":"Untás un arma con tu Sangre y sus golpes hacen daño agravado. Sin tirada; cada impacto consume 1 Sangre.",
  "Sabor a Muerte":"Escupís Sangre corrosiva que quema carne y hueso. Resistencia + Atletismo dif. 6 para acertar; cada Sangre escupida hace 2 dados de daño agravado. Alcance: 3 m por punto de Fuerza más Potencia.",
  "Testigo de la Muerte":"Ves a los fantasmas que andan por el mundo de los vivos durante la escena. Percepción + Consciencia dif. 5; con un fracaso solo ves a los muertos.",
  "Invocar Alma":"Traés a un fantasma para hablar con él. Necesitás su nombre y un objeto que haya tocado en vida. 1 Sangre y Manipulación + Ocultismo (dif. 7 o su Fuerza de Voluntad).",
  "Compeler Alma":"Obligás a un fantasma a obedecerte por un tiempo, o lo castigás. 1 Sangre y Manipulación + Ocultismo enfrentada a su Fuerza de Voluntad (dif. 6).",
  "Embrujo":"Atás un fantasma a un lugar o a un objeto; no puede irse sin arriesgarse a desaparecer. 1 Sangre y Manipulación + Ocultismo (dificultad = su Fuerza de Voluntad).",
  "Tormento":"Golpeás a un fantasma como si estuvieras en su mundo, sin que él pueda devolverte el golpe. Resistencia + Empatía contra su Fuerza de Voluntad; cada éxito es un nivel de daño letal.",
  "Juego de Sombras":"Movés y alargás las sombras que ya hay. Escondido en ellas, sumás 1 dado a Sigilo y te disparan con +1 a la dificultad; también podés asustar o sofocar con ellas. 1 Sangre; dura la escena.",
  "Manto de la Noche":"Creás una nube de oscuridad total de unos 3 m que apaga la luz y ahoga el sonido; cada éxito extra duplica el diámetro. Manipulación + Ocultismo dif. 7, hasta 50 m de distancia. Los de adentro pierden dados y pueden entrar en pánico.",
  "Brazos del Abismo":"De la oscuridad salen tentáculos que agarran y aprietan a tus enemigos: uno por éxito. 1 Sangre y Manipulación + Ocultismo dif. 7; cada tentáculo tiene Fuerza y Destreza igual a tu Obtenebración y hace daño letal de Fuerza + 1.",
  "Metamorfosis Negra":"Te cubrís de oscuridad viva con cuatro tentáculos que pelean por vos; los enemigos cerca tuyo pierden dados de Resistencia y absorción, y das miedo. 2 Sangre y Manipulación + Coraje dif. 7.",
  "Forma Tenebrosa":"Te convertís en una sombra: inmune a los ataques físicos (no al fuego ni al sol), pasás por rendijas y subís paredes. No podés atacar físicamente, pero sí envolver a otros y usar Disciplinas mentales. 3 Sangre.",
  "Capa de Sombras":"Te volvés invisible mientras estés quieto, callado y detrás de algo, en un lugar sin luz directa. Sin tirada. Solo te ve otro vampiro con suficiente Auspex.",
  "Presencia Invisible":"Te movés sin que nadie te vea: la gente mira para otro lado sin darse cuenta. Sin tirada mientras no hables, ataques o llames la atención; si hacés algo que pueda delatarte, Astucia + Sigilo.",
  "Máscara de las Mil Caras":"Los demás ven la cara que vos quieras: inventada o la de alguien que observaste bien. Manipulación + Interpretación dif. 7; con más éxitos el disfraz es más convincente. Parecer más lindo que vos cuesta Sangre extra.",
  "Desvanecerse del Ojo de la Mente":"Desaparecés aunque te estén mirando de frente. Carisma + Sigilo contra la Astucia + Alerta del que mira: con más de 3 éxitos te esfumás del todo, y con éxitos que superen su Fuerza de Voluntad hasta se olvida de que estabas.",
  "Encubrimiento de la Concurrencia":"Ocultás a otros junto con vos, con cualquier poder de Ofuscación que tengas: una persona extra por cada punto de Sigilo. Una sola tirada para todos.",
  "Fascinación":"Todos los que te rodean se sienten atraídos por vos y tienden a darte la razón: sirve para discursos, reuniones o una barra llena. 1 Sangre y Carisma + Interpretación dif. 7: 1 éxito afecta a una persona, 2 a dos, 3 a seis, 4 a veinte, 5 a todos los presentes. Dura la escena; el peligro rompe el efecto.",
  "Mirada Aterradora":"Mostrás tu Bestia (colmillos, siseo, mirada de odio) y el blanco se acobarda; con 3 éxitos o más huye aterrado. Carisma + Intimidación, dificultad = su Astucia + Coraje. Cada éxito le quita un dado en su próximo turno.",
  "Encantamiento":"Hacés que alguien te quiera de verdad y te sirva por voluntad propia, como un amigo devoto. 1 Sangre y Apariencia + Empatía, dificultad = su Fuerza de Voluntad; dura de una hora a meses según los éxitos.",
  "Invocación":"Llamás a cualquier persona que hayas conocido, esté donde esté, y viene hacia vos sin saber bien por qué. 1 Sangre y Carisma + Subterfugio (dif. 5; 7 si lo viste poco; 4 si ya lo afectaste con Presencia). Con más éxitos llega más rápido y mejor dispuesto.",
  "Majestad":"Imponés tanto respeto o temor que nadie se anima a contradecirte. 1 FV, sin tirada. Para desobedecerte o faltarte el respeto, cada uno tira Coraje contra tu Carisma + Intimidación; si falla, se humilla ante vos.",
  "Ojos de la Bestia":"Ves perfectamente en la oscuridad total; tus ojos brillan rojos. Sin tirada, tarda un turno. +1 a la dificultad Social con mortales mientras no te tapes los ojos.",
  "Garras Salvajes":"Te crecen garras en manos o pies que hacen daño agravado de Fuerza + 1; también te ayudan a trepar (−2 a la dificultad). 1 Sangre; tarda un turno y dura la escena.",
  "Fusión con la Tierra":"Te hundís en la tierra (no en cemento ni madera) y pasás el día protegido del sol. 1 Sangre, tarda un turno. Quedás casi en Letargo: para despertar antes por un peligro tirás Humanidad dif. 6.",
  "Forma de la Bestia":"Te transformás en un lobo o en un murciélago enorme, con sus sentidos y capacidades (morder, correr, volar). 1 Sangre; tarda tres turnos (uno menos por cada Sangre extra) y dura hasta el amanecer.",
  "Forma de Niebla":"Te volvés niebla: flotás, pasás por debajo de las puertas y los ataques físicos normales no te afectan. 1 Sangre; tarda tres turnos (uno menos por cada Sangre extra). No podés usar poderes que requieran mirar a los ojos.",
  "Ignis Fatuus":"Creás una ilusión quieta que engaña un solo sentido: un olor, un sonido, una imagen. 1 FV; dura hasta que te vayas o alguien la descubra.",
  "Fata Morgana":"Creás una ilusión quieta que engaña todos los sentidos, aunque no tiene sustancia. 1 FV + 1 Sangre. Si alguien la pone a prueba, se deshace.",
  "Aparición":"Le das movimiento a una ilusión: una persona que camina, agua que corre, fuego que crepita. 1 Sangre. Mientras la mantenés, hacer algo complicado exige una tirada de Fuerza de Voluntad.",
  "Permanencia":"Tu ilusión sigue existiendo aunque no la estés mirando, hasta que alguien la disipe. 1 Sangre.",
  "Realidad Horrenda":"La víctima cree que tu ilusión es real: el fuego la quema y la soga la ahorca. 2 FV; para dañarla, Manipulación + Subterfugio contra su Percepción + Autocontrol; cada éxito es un nivel letal que no se absorbe.",
  "Ojos de Serpiente":"Tus ojos se vuelven dorados de pupila ancha y el mortal que te mira a los ojos queda paralizado mientras no apartes la vista. Sin tirada; se evita no mirándote. Contra vampiros tirás Fuerza de Voluntad dif. 9, y si los atacan pueden gastar 1 FV para soltarse.",
  "Lengua de Áspid":"Tu lengua se alarga medio metro y se vuelve bífida: latigazo con daño agravado de Fuerza (dif. 6). Si herís, al turno siguiente podés beber como si hubieras mordido. También te ayuda a moverte en la oscuridad.",
  "Piel de Víbora":"Tu piel se vuelve escamosa y elástica: absorbés a dif. 5, podés absorber con Resistencia el agravado de garras y colmillos (no fuego ni sol) y tu mordida hace un dado más. Pasás por cualquier hueco por el que entre tu cabeza. 1 Sangre + 1 FV; Apariencia baja a 1.",
  "Forma de Cobra":"Te convertís en una cobra negra gigante: mordida venenosa mortal para los humanos, olfato agudo y te deslizás por lugares estrechos. 1 Sangre; tarda tres turnos y dura hasta el amanecer.",
  "Corazón de las Tinieblas":"Te sacás el corazón y lo escondés en una urna: no te pueden clavar una estaca en él y resistís mejor el Frenesí, pero si alguien encuentra la urna te tiene en sus manos. Solo en Luna nueva.",
  "Sabor de la Sangre":"Probando la sangre de alguien sabés cuánta Vitae le queda, hace cuánto se alimentó, su Generación aproximada y, con 3 éxitos, si cometió diablerie. Cada uso de Taumaturgia cuesta 1 Sangre y una tirada de FV a dificultad nivel + 3.",
  "Furia de Sangre":"Tocando a un vampiro, lo obligás a gastar Sangre como vos elijas (en Atributos, Disciplinas…), un punto por éxito, aunque pase su límite por turno. Cada éxito también le sube +1 la dificultad para resistir el Frenesí.",
  "Sangre de Potencia":"Concentrás tu Sangre y bajás tu Generación un grado durante una hora; cada éxito extra da otro grado u otra hora. Una vez por noche.",
  "Robo de Vitae":"Le sacás Sangre a alguien a la vista, a menos de 15 m: vuela por el aire hasta vos. Un punto por éxito, sin quedar Vinculado. Es tan llamativo que rompe la Mascarada.",

// Devuelve "" si el paso está bien, o el motivo para no avanzar.
function validarPaso(s){
  if(s === 0) return W.nombre.trim() ? "" : "Falta el nombre.";
  if(s === 1) return W.clan ? "" : "Elegí un clan.";
  if(s === 2){
    if(new Set(Object.values(W.prioA)).size !== 3) return "Cada grupo necesita una prioridad distinta: 7, 5 y 3.";
    for(const g of Object.keys(ATR)){ const d = W.prioA[g] - gastoAtr(g); if(d) return `${lab(g)}: ${d>0?`te quedan ${d} punto(s)`:`te pasaste por ${-d}`}.`; }
    return "";
  }
  if(s === 3){
    if(new Set(Object.values(W.prioH)).size !== 3) return "Cada grupo necesita una prioridad distinta: 13, 9 y 5.";
    for(const g of Object.keys(HAB)){ const d = W.prioH[g] - gastoHab(g); if(d) return `${lab(g)}: ${d>0?`te quedan ${d} punto(s)`:`te pasaste por ${-d}`}.`; }
    return "";
  }
  if(s === 4){ const t = sumaVals(W.dis, disClan()); return t === 3 ? "" : t < 3 ? `Te quedan ${3-t} punto(s) de Disciplinas.` : `Te pasaste por ${t-3}.`; }
  if(s === 5){ const t = sumaVals(W.tras, TRASFONDOS); return t === 5 ? "" : t < 5 ? `Te quedan ${5-t} punto(s) de Trasfondos.` : `Te pasaste por ${t-5}.`; }
  if(s === 6){ const t = extraVir(); return t === 7 ? "" : t < 7 ? `Te quedan ${7-t} punto(s) de Virtudes.` : `Te pasaste por ${t-7}.`; }
  if(s === 7){
    for(let p = 2; p <= 6; p++){ const e = validarPaso(p); if(e) return `Puntos iniciales · ${PASOS[p]}: ${e}`; }
    const falta = W.myd.find(x => !x.propio && DET_MYD[x.tipo+":"+x.nombre] && !(x.detalle||"").trim());
    if(falta) return `Aclará ${falta.nombre}: ${DET_MYD[falta.tipo+":"+falta.nombre][0]}`;
    if(puntosDefectosW() > 7) return `Los Defectos suman ${puntosDefectosW()} puntos; el máximo es 7.`;
    if(gastoGrat() > dispGrat()) return `Gastaste ${gastoGrat()} puntos gratuitos y tenés ${dispGrat()}.`;
    if(gastoGrat() < dispGrat()) return `Te quedan ${dispGrat() - gastoGrat()} punto(s) gratuitos por gastar.`;
    for(const k of Object.keys(W.grat)){ const [t,r] = k.split(":"); if(totalRasgo(t,r) > maxRasgo(t,r)) return `${lab(r||t)} queda por encima de su máximo.`; }
    return "";
  }
  if(s === 8) return W.sangre ? "" : "Tirá 1d10 para la Sangre inicial.";
  return "";
}

// ¿Quedan puntos iniciales sin gastar en el grupo de este rasgo? (así un círculo vacío se llena con uno inicial, no con un gratuito)
function puedeSumarInicial(tipo, k){
  const base = (W[PREF_PICK[tipo]] || {})[k] || 0;
  if(tipo === "atributo"){ const g = Object.keys(ATR).find(x => ATR[x].includes(k)); return base < 5 && gastoAtr(g) < W.prioA[g]; }
  if(tipo === "habilidad"){ const g = Object.keys(HAB).find(x => HAB[x].includes(k)); return base < 3 && gastoHab(g) < W.prioH[g]; }

function porRepartir(s){
  // Con varios grupos (Atributos, Habilidades) un grupo pasado no se compensa con las sobras de otro: se avisa que te pasaste.
  const grupos = (o, prio, gasto) => { const r = Object.keys(o).map(g => prio[g] - gasto(g)), total = Object.keys(o).reduce((a, g) => a + prio[g], 0);
    const pasado = r.filter(x => x < 0).reduce((a, x) => a + x, 0); return {resta: pasado || r.reduce((a, x) => a + x, 0), total}; };
  if(s === 2) return grupos(ATR, W.prioA, gastoAtr);
  if(s === 3) return grupos(HAB, W.prioH, gastoHab);
  if(s === 4) return {resta: 3 - sumaVals(W.dis, disClan()), total: 3};
  if(s === 5) return {resta: 5 - sumaVals(W.tras, TRASFONDOS), total: 5};
  if(s === 6) return {resta: 7 - extraVir(), total: 7};
  if(s === 7) return {resta: dispGrat() - gastoGrat(), total: dispGrat()};
  return null;
}

function armarFichaW(){
  const atr = {}, hab = {}, dis = {}, tras = {}, vir = {};
  Object.values(ATR).flat().forEach(a => atr[a] = totalRasgo("atributo",a));
  HAB_ALL.forEach(h => { const v = totalRasgo("habilidad",h); if(v) hab[h] = v; });
  disClan().forEach(d => { const v = totalRasgo("disciplina",d); if(v) dis[d] = v; });
  TRASFONDOS.forEach(t => { const v = totalRasgo("trasfondo",t); if(v) tras[t] = v; });
  VIRT.forEach(v => vir[v] = totalRasgo("virtud",v));
  const generacion = generacionW(), [, reserva] = GEN[generacion];
  const c = clanDe(W.clan) || ["","",[],""];
  const slug = s => norm(s).replace(/[^a-z0-9_]/g,"");
  const defectos = W.myd.filter(x => x.tipo === "Defecto").map(x => ({id:(x.nombre === "Adicción" ? "adiccion" : slug(x.nombre)), nombre:conDetalle(x), efecto:x.desc, ...(x.detalle?.trim() ? {detalle:x.detalle.trim()} : {}), puntos:x.puntos, propio:!!x.propio}));
  const meritos = W.myd.filter(x => x.tipo === "Mérito").map(x => ({id:slug(x.nombre), nombre:conDetalle(x), efecto:x.desc, ...(x.detalle?.trim() ? {detalle:x.detalle.trim()} : {}), puntos:x.puntos, propio:!!x.propio}));
  defectos.push({id: W.clan === "seguidores_de_set" ? "debilidad_set" : "debilidad_"+W.clan, nombre:`Debilidad de clan (${c[0]})`,
    efecto: c[3] + (W.detalle ? " "+c[4].replace(/^¿|\?$/g,"")+": "+W.detalle+"." : "")});
  return {nombre:nombreCompuesto(), nombre_real:W.nombre.trim(), apodo:W.apodo.trim(), clan:W.clan, clan_nombre:c[0], generacion, concepto:W.concepto.trim(), naturaleza:W.naturaleza, conducta:W.conducta,
    descripcion:W.desc.trim(), atributos:atr, habilidades:hab, disciplinas:dis, poderes:poderesDe(dis), trasfondos:tras, trasfondos_detalle:Object.fromEntries(Object.entries(W.trasDet).filter(([t,v]) => tras[t] && v.trim()).map(([t,v]) => [t, v.trim()])), virtudes:vir,
    humanidad:Math.min(totalRasgo("humanidad"),10), fv_max:Math.min(totalRasgo("fuerza_voluntad"),10), fv:Math.min(totalRasgo("fuerza_voluntad"),10),
    sangre:Math.min((W.sangre||0) + totalRasgo("trasfondo","dominio"), reserva), salud:[], xp:0, xp_total:0, meritos, defectos, estado:"activo", vampiro:true,
    criterios:{umbral_hambre:7}, puntos_gratuitos:{...W.grat}, creado:new Date().toISOString()};
}

   Director propio de cada personaje (con el Claude del jugador)
   Cuaderno (director/<id>): premisa, ciudad, frentes con reloj, PNJ, misterios, canon, instrucción de la noche.
   Crónica (cronica/<id>): resumen y hechos de cada noche cerrada.
   El Narrador recibe solo la instrucción de la noche, los PNJ en juego, el canon reciente y la crónica comprimida.

let CRONICA = {noches:[]};
const ESTILO_DIRECTOR = `Sos el Director de una crónica de Vampiro: La Mascarada 20º Aniversario (V20) en Buenos Aires, en el presente, para un jugador que juega con un Narrador IA. Lugares reales de la ciudad; tono y reglas de V20; nada de poderes ni reglas inventadas. La crónica es propia de esta mesa: no uses PNJ canónicos de los libros ni de otras crónicas, inventá todo con nombres propios. Castellano rioplatense.`;
const corto = (s, n) => { s = String(s || ""); return s.length > n ? s.slice(0, n) + "…" : s; };
function fichaCorta(f){
  return {nombre:f.nombre, clan:f.clan_nombre || lab(f.clan||""), generacion:f.generacion, concepto:f.concepto, naturaleza:f.naturaleza, conducta:f.conducta,

}
function cuadernoParaDirector(){
  const c = GUIA || {};
  return {premisa:c.premisa || c.texto || "", ciudad:c.ciudad || "", frentes:c.frentes || [], pnj:c.pnj || [], misterios:c.misterios || [],
    canon:(c.canon || c.secretos || []).slice(-40), ganchos:c.ganchos || []};
}
function cronicaParaDirector(){
  const ns = CRONICA?.noches || [];
  return ns.map(n => `Noche ${n.noche}: ${n.resumen}${(n.hechos||[]).length ? " Hechos: " + n.hechos.join("; ") : ""}`).join("\n") || "(todavía no hay noches cerradas)";
}
// Crónica para el Narrador: las 3 últimas noches completas, las anteriores en una línea.
function cronicaCorta(){
  const ns = CRONICA?.noches || []; if(!ns.length) return "";
  const viejas = ns.slice(0, -3).map(n => `- Noche ${n.noche}: ${corto(n.resumen, 160)}`);
  const nuevas = ns.slice(-3).map(n => `- Noche ${n.noche}: ${n.resumen}${(n.hechos||[]).length ? " (" + n.hechos.join("; ") + ")" : ""}`);
  return "\n=== CRÓNICA (noches anteriores) ===\n" + [...viejas, ...nuevas].join("\n");
}
function bloqueDirector(){
  const c = GUIA || {};
  if(!c.premisa){   // personaje con guía vieja (texto libre)
    return `=== GUÍA DEL DIRECTOR (para vos; el personaje no sabe esto) ===
${c.texto || ""}
${(c.pnj||[]).map(p => `- ${p.nombre}: ${p.descripcion || [p.rol, p.quiere].filter(Boolean).join("; ")}`).join("\n")}
${(c.canon||c.secretos||[]).length ? "Verdades ya decididas:\n" + (c.canon||c.secretos).slice(-15).map(s => "- " + s.texto).join("\n") : ""}
${c.instruccion_noche ? "Para esta noche: " + c.instruccion_noche : ""}`;
  }
  const enJuego = new Set(c.pnj_en_juego || []);
  const pnj = (c.pnj || []).filter(p => !enJuego.size || enJuego.has(p.nombre));
  return `=== DIRECTOR: ESTA NOCHE (para vos; el personaje no sabe esto) ===
${c.instruccion_noche || "Retomá la escena donde quedó."}

PNJ que pueden aparecer:
${pnj.map(p => `- ${p.nombre} (${p.rol || ""}). Quiere: ${p.quiere || "?"}. Cómo habla: ${p.como_habla || "?"}. Ahora: ${p.estado || "?"}. Esconde (no lo reveles salvo que lo descubra): ${p.esconde || "nada"}`).join("\n") || "- (ninguno en particular)"}
Otros PNJ de la crónica: ${(c.pnj || []).filter(p => !pnj.includes(p)).map(p => p.nombre).join(", ") || "—"} (si aparecen, consultá al Director).
${(c.canon||[]).length ? "\nVerdades ya decididas (canon):\n" + c.canon.slice(-12).map(s => "- " + s.texto).join("\n") : ""}`;
}
function unirPnj(c, lista, nuevos){
  c.pnj ||= [];
  for(const p of (lista || [])){ const x = c.pnj.find(q => norm(q.nombre) === norm(p?.nombre)); if(x) Object.assign(x, Object.fromEntries(Object.entries(p).filter(([,v]) => v !== "" && v != null))); }
  for(const p of (nuevos || [])) if(p?.nombre && !c.pnj.some(q => norm(q.nombre) === norm(p.nombre))) c.pnj.push({nombre:String(p.nombre), rol:String(p.rol||""), quiere:String(p.quiere||""), esconde:String(p.esconde||""), como_habla:String(p.como_habla||""), estado:String(p.estado||"")});
}
function unirFrentes(c, lista){
  for(const fr of (lista || [])){ const x = (c.frentes ||= []).find(q => norm(q.nombre) === norm(fr?.nombre)); if(x && Number.isFinite(Number(fr.reloj))) x.reloj = Math.max(0, Math.min(6, Number(fr.reloj))); }
}

  const prompt = `${ESTILO_DIRECTOR}

{"respuesta": "la verdad o la decisión para el Narrador, 2 a 4 oraciones, con lo que puede mostrar ahora y lo que todavía no",
 "canon": "una línea con lo que queda decidido para siempre",

(pnj_nuevo: null si no hace falta)

Escena: noche ${MUNDO.noche || 1}, ${MUNDO.hora || ""}, ${MUNDO.lugar || ""}. Lo que pasó esta noche: ${MUNDO.resumen || "(sin resumen)"}

Cuaderno del Director:
${JSON.stringify(cuadernoParaDirector())}

Crónica:
${cronicaParaDirector()}`;
  try {

}

// 4) Al cerrar la noche: resumen en la crónica y cuaderno actualizado. Los mensajes viejos dejan de mandarse.
function registroDeLaNoche(){
  const lineas = MSGS.filter(m => m.n > (MUNDO.cierre_n || 0)).map(m =>
    m.rol === "narrador" ? "Narrador: " + m.texto : m.rol === "jugador" && !m.oculto ? "Jugador: " + m.texto :
    m.rol === "pedido" && m.resuelto ? `[Tirada ${m.resultado.titulo}: ${textoTirada(m.resultado)}]` :
    m.rol === "dados" ? `[Tirada PNJ ${m.datos.titulo}: ${textoTirada(m.datos)}]` : m.rol === "sistema" && m.clase !== "err" ? "[" + m.texto + "]" : "").filter(Boolean);
  const t = lineas.join("\n");
  return t.length > 14000 ? "…" + t.slice(-14000) : t;
}
async function cerrarNocheDirector(){
  if(modoMesa() || !SAMPLE || !GUIA) return;

Cuaderno del Director:
${JSON.stringify(cuadernoParaDirector())}

Resumen que llevaba el Narrador: ${MUNDO.resumen || "(ninguno)"}

Lo que pasó esta noche:
${registro}`;
  try {
    const r = await SAMPLE.json(prompt, {cache:false});
    if(!r?.resumen) return;
    CRONICA.noches = [...(CRONICA.noches || []), {noche:MUNDO.noche || 1, resumen:String(r.resumen), hechos:(Array.isArray(r.hechos) ? r.hechos : []).map(String).slice(0, 10)}];
    escribir(R.cron(), CRONICA);
    unirPnj(GUIA, (Array.isArray(r.pnj) ? r.pnj : []).map(p => ({nombre:p?.nombre, estado:[p?.estado, p?.actitud_hacia_pj ? "con el personaje: " + p.actitud_hacia_pj : ""].filter(Boolean).join(". ")})), r.pnj_nuevos);
    unirFrentes(GUIA, r.frentes);
    for(const q of (r.misterios_revelados || [])){ const m = (GUIA.misterios || []).find(x => norm(x.pregunta) === norm(q)); if(m) m.revelado = true; }
    escribir(R.guia(), GUIA);
    MUNDO.cierre_n = Math.max(0, ...MSGS.map(m => m.n || 0));
    MUNDO.historia = [MUNDO.historia, `Noche ${MUNDO.noche || 1}: ${r.resumen}`].filter(Boolean).join("\n").slice(-3000);
    guardarMundo();
  } catch(e){ console.warn("director cierre", e); }
}

async function crearPersonaje(){
  if(primerPasoInvalido() >= 0 || W.guardando) return;
  if(!DB){ sysMsg("No se pudo abrir el guardado de este dispositivo.", "err", false); return; }
  W.guardando = true; renderWz();
  const f = armarFichaW();
  f.revision_narrador = {aprobado:null, observaciones:["Lo revisa el Narrador."], fecha:new Date().toISOString()};
  const id = (norm(f.nombre_real).replace(/[^a-z0-9_]/g,"").slice(0,24) || "pj") + "_" + Date.now().toString(36);
  const nombresRef = lineasRefugio();
  const refugios_ = nombresRef.map((nombre, i) => ({id: i === 0 ? "refugio" : "refugio" + (i + 1), nombre, descripcion:"", notas:""}));
  const items = W.equipo.split("\n").map(x => x.trim()).filter(Boolean).map((nombre,i) => ({id:"obj"+(i+1), nombre, tipo:"equipo", lugar:ENCIMA}));
  const docs = [
    ["personajes/"+id, f],
    ["inventario/"+id, {items, refugios:refugios_, dinero:W.dinero||0}],
    ["conocimiento/"+id, {hechos: nombresRef.length ? [{id:"refugio", texto:`${nombresRef.length === 1 ? "Su refugio" : "Sus refugios"}: ${nombresRef.join("; ")}.`, tema:"mateo"}] : []}],
    ["notas/"+id, {texto:""}],
    ["mundo/"+id, {modo:"mesa", registro_mesa:[]}]];
  try {
    for(const [p, d] of docs) await DB.doc(p).set(JSON.parse(JSON.stringify(d)));
    escribir("eventos/e"+nextN(), {n:lastN, tipo:"personaje_creado", pj:id, noche:1, detalle:{nombre:f.nombre, clan:f.clan, generacion:f.generacion, gratuitos:f.puntos_gratuitos}});
  } catch(e){
    W.guardando = false; renderWz();
    const er = $("#s-crear .err"); if(er) er.textContent = "No se pudo guardar el personaje ("+(e.code||"error")+"). Probá de nuevo.";
    return;
  }
  W = nuevoW();
  await cambiarPersonaje(id);
  sysMsg(`${f.nombre} quedó creado. Para jugar con un Narrador IA, abrí Menú → Partida.`, "rule", false);
}

function nivelesInfo(k){
  if(INFO[k]?.[1]) return INFO[k][1];
  if(k === "celeridad") return [1,2,3,4,5].map(i => `+${i} dado${i>1?"s":""} en todas las tiradas de Destreza. Al empezar un turno puede pagar hasta ${i} de Sangre (aunque pase su límite) para ${i>1?"tener hasta "+i+" acciones físicas extra":"tener una acción física extra"}, con la reserva completa y al final del turno; cada punto usado así deja de sumar su dado de Destreza ese turno.`);
  if(k === "fortaleza") return [1,2,3,4,5].map(i => `+${i} a la absorción, también contra agravado, fuego y sol.`);
  if(k === "potencia") return [1,2,3,4,5].map(i => `+${i} dado${i>1?"s":""} en las tiradas de Fuerza y en el daño cuerpo a cuerpo. Por 1 de Sangre, durante ese turno esos dados pasan a ser ${i} éxito${i>1?"s":""} automático${i>1?"s":""}.`);
  if(PODERES[k]) return PODERES[k];
  return null;
}

const infoBtn = (k, v, texto) => `<button type="button" class="info" data-info="${k}" data-v="${v||0}">${texto || lab(k)}</button>`;
function mostrarInfo(k, v){
  const d = INFO[k]; if(!d) return;
  const niv = nivelesInfo(k);
  abrirSheet(`<div class="sec-lbl">${v ? "Tiene "+v : "Sin puntos"}</div><h2>${esc(lab(k))}</h2><p class="info-desc">${esc(d[0])}</p>
    ${niv ? `<ol class="niveles">${niv.map((t,i) => { const nom = String(t).split(":")[0].replace(/\.$/, "").trim(), dsc = DESC_PODER[nom];
      const k = String(t).indexOf(":"), resto = k > 0 ? String(t).slice(k) : "";
      const fila = `<span class="dots">${"●".repeat(i+1)}<i>${"●".repeat(4-i)}</i></span><span>${dsc ? `<u class="pn">${esc(nom)}</u>${esc(resto)}` : esc(t)}</span>`;
      return `<li class="${i+1===v?"actual":""}">${dsc ? `<details class="pdet"><summary>${fila}</summary><p>${esc(dsc)}</p></details>` : fila}</li>`; }).join("")}</ol>
      ${niv.some(t => DESC_PODER[String(t).split(":")[0].replace(/\.$/, "").trim()]) ? '<p class="pen">Tocá un poder para ver qué hace.</p>' : ""}` : ""}
    <div class="row"><button class="btn ghost" type="button" id="info-x">Cerrar</button></div>`, () => { $("#info-x").onclick = cerrarSheet; $("#info-x").focus(); });
}
document.addEventListener("click", e => { const b = e.target.closest("[data-info]"); if(!b) return; e.preventDefault(); mostrarInfo(b.dataset.info, Number(b.dataset.v)||0); });

function enlazarMyd(wz, re){
  wz.querySelectorAll("[data-myd]").forEach(b => b.onclick = e => { e.stopPropagation(); mostrarMyd(b.dataset.myd); });
  const abiertos = () => [...wz.querySelectorAll("details")].map(x => x.open);
  const rehacer = () => { const a = abiertos(); re(); wz.querySelectorAll("details").forEach((x,i) => x.open = a[i]); };
  wz.querySelectorAll("[data-mydc]").forEach(c => c.onchange = () => {
    const x = MYD_INDEX[c.dataset.mydc]; if(!x) return;
    if(c.checked){ const sel = wz.querySelector(`[data-mydp="${CSS.escape(c.dataset.mydc)}"]`);
      W.myd.push({tipo:x.tipo, nombre:x.nombre, cat:x.cat, desc:x.desc, puntos: sel ? +sel.value : costoMyd(x), detalle:""}); }
    else W.myd = W.myd.filter(y => !(y.tipo === x.tipo && y.nombre === x.nombre && !y.propio));
    rehacer();
    if(c.checked && DET_MYD[c.dataset.mydc]){ const q = wz.querySelector(`[data-mydq="${CSS.escape(c.dataset.mydc)}"]`); if(q) q.focus(); } });
  wz.querySelectorAll("[data-mydp]").forEach(s => s.onchange = () => {
    const x = MYD_INDEX[s.dataset.mydp], e = W.myd.find(y => y.tipo === x.tipo && y.nombre === x.nombre && !y.propio);
    if(e){ e.puntos = +s.value; rehacer(); } });
  wz.querySelectorAll("[data-mydq]").forEach(i => i.oninput = () => {
    const x = MYD_INDEX[i.dataset.mydq], e = x && W.myd.find(y => y.tipo === x.tipo && y.nombre === x.nombre && !y.propio);
    if(!e) return; e.detalle = i.value;
    const e2 = validarPaso(W.step), n = $("#wz-next"); if(n) n.disabled = !!e2; const er = wz.querySelector("p.err"); if(er) er.textContent = e2; });
  wz.querySelectorAll("[data-qp]").forEach(b => b.onclick = () => { W.myd = W.myd.filter(y => !(y.propio && y.nombre === b.dataset.qp)); rehacer(); });
  const add = $("#df-add"); if(add) add.onclick = () => {
    const n = $("#df-n").value.trim(); if(!n){ $("#df-n").focus(); return; }
    W.myd.push({tipo:$("#df-t").value, nombre:n, cat:"Propio", desc:$("#df-e").value.trim(), puntos:+$("#df-p").value, propio:true}); rehacer(); };
}

/* ---------- Revisión del Narrador antes de crear el personaje ---------- */
async function revisarConNarrador(f){
  if(!SAMPLE) return {aprobado:null, observaciones:["El Narrador con IA no está disponible en esta vista; queda pendiente de revisión del Director."]};
  const rec = totalRasgo("trasfondo","recursos");
  const datos = {nombre:f.nombre, concepto:f.concepto, clan:f.clan_nombre, generacion:f.generacion, naturaleza:f.naturaleza, conducta:f.conducta,
    descripcion:f.descripcion, atributos:f.atributos, habilidades:f.habilidades, disciplinas:f.disciplinas, trasfondos:f.trasfondos,
    virtudes:f.virtudes, humanidad:f.humanidad, fuerza_de_voluntad:f.fv_max,
    meritos:W.myd.filter(x => x.tipo === "Mérito").map(x => `${conDetalle(x)} (${x.puntos})${x.propio ? " [propio: "+x.desc+"]" : ""}`),
    defectos:W.myd.filter(x => x.tipo === "Defecto").map(x => `${conDetalle(x)} (${x.puntos})${x.propio ? " [propio: "+x.desc+"]" : ""}`),
    refugios:lineasRefugio(), equipo_encima:lineasEquipo(), dinero_pesos:W.dinero||0,
    guia_recursos:`Recursos ${rec}: ${limiteRecursos().texto} Referencia: hasta ${pesos(limiteRecursos().dinero)} y ${limiteRecursos().equipo} objetos.`};
  const prompt = `Sos el Narrador de una crónica de Vampiro: La Mascarada 20º Aniversario en Buenos Aires (año actual). Un jugador terminó de crear su personaje; los puntos ya fueron validados por el motor de reglas. Tu trabajo es decidir si el personaje es VÁLIDO para la mesa, como haría un Narrador en la creación:
- ¿El equipo, el dinero y los refugios (puede no tener ninguno) son coherentes con su Trasfondo Recursos y su concepto? (armas, vehículos o cosas caras con Recursos bajos: no).
- Méritos y Defectos propios (marcados [propio]): ¿el efecto es claro y el costo en puntos es justo comparado con los del manual? Si no, proponé el costo correcto.
- Méritos o Defectos del manual: ¿son compatibles con el clan y el concepto? (por ejemplo, Temperamental o Corazón Calmado no van con Brujah; Monstruoso no va con Nosferatu).
- ¿El concepto, la Naturaleza y la Conducta tienen sentido juntos?
No rechaces por cuestiones de gusto. Rechazá solo lo que un Narrador justo no aceptaría. Hablá en castellano rioplatense, breve y concreto.
Respondé SOLO con JSON así: {"aprobado": true|false, "observaciones": ["frase corta", ...]}. Si aprobás, las observaciones pueden ser sugerencias o quedar vacías. Si rechazás, cada observación dice qué cambiar.

Personaje:
${JSON.stringify(datos)}`;
  try {
    const r = await SAMPLE.json(prompt, {cache:false});
    return {aprobado: r?.aprobado === true, observaciones: Array.isArray(r?.observaciones) ? r.observaciones.map(String).slice(0,8) : []};
  } catch(e){
    if(e?.code === "not_granted") return {aprobado:null, observaciones:["Para que el Narrador revise el personaje, permití que la página use Claude."]};
    return {aprobado:null, observaciones:["No se pudo consultar al Narrador ("+(e?.code||"error")+"). Probá de nuevo."]};
  }
}

/* ---------- utilidades de tirada ---------- */
function exitosCon(dados, dif, auto=0, esp=false){
  const hits = dados.filter(d => d >= dif).length, unos = dados.filter(d => d === 1).length;
  const ex = hits + (esp ? dados.filter(d => d === 10).length : 0);
  const neto = ex - Math.min(unos, ex) + auto;
  if(hits === 0 && unos > 0 && auto === 0) return {neto:0, texto:"fracaso"};
  return {neto:Math.max(neto,0), texto: neto > 0 ? `${neto} éxito${neto>1?"s":""}` : "fallo"};
}

// Caras de una tirada: los éxitos que anulan los 1 quedan con un borde rojo fino (se anulan los más altos).
function carasDados(dados, dif, anulados, esp=false){
  let k = Math.max(0, anulados || 0), u = k;   // k éxitos anulados (los más altos) y los u unos que los anulan
  return dados.map(v => {
    const vale = esp && v === 10 ? 2 : 1;
    if(dif && k >= vale && v >= dif){ k -= vale; return `<span class="drw anulado" title="Éxito anulado por un 1"><div class="d10">${v}</div></span>`; }
    if(dif && vale === 2 && v >= dif) return `<span class="drw extra" title="Especialidad: vale dos éxitos">${caraDado(v, dif)}</span>`;
    if(dif && u > 0 && v === 1){ u--; return `<span class="drw anulado" title="Uno que anula un éxito"><div class="d10">${v}</div></span>`; }
    return caraDado(v, dif); }).join("");
}
const anuladosDe = (dados, dif, esp=false) => { const ex = dados.filter(d => d >= dif).length + (esp ? dados.filter(d => d === 10).length : 0), unos = dados.filter(d => d === 1).length; return Math.min(ex, unos); };
const anuladosT = t => t.resultado === "fracaso" ? 0 : Math.max(0, (t.exitos||0) + (t.automaticos||0) - (t.neto||0));

/* ---------- daño y curación directos (el Narrador ya dice cuánto) ---------- */
function danoDirecto(n, tipo, fuente){
  n = Math.max(0, Math.floor(n));
  let estado = F.estado || "activo";
  for(let i=0;i<n;i++){
    if(F.salud.length >= SALUDV().length){ estado = tipo === "A" ? "muerte_definitiva" : (estado === "muerte_definitiva" ? estado : "letargo"); continue; }
    F.salud.push(tipo);
  }
  F.salud.sort((a,b) => "ALC".indexOf(a) - "ALC".indexOf(b));
  if(F.salud.length >= SALUDV().length && (F.sangre||0) === 0 && estado === "activo") estado = "letargo";
  F.estado = estado;
  evento("dano", {niveles:n, tipo, fuente, salud:[...F.salud], estado, modo:"mesa"});
}
function curarDirecto(n, tipo, pagar){
  n = Math.max(1, Math.floor(n));
  const hay = F.salud.filter(t => t === tipo).length;
  if(!hay) throw new ReglaError(`${F.nombre} no tiene daño ${TIPO_DANO[tipo]} para curar.`);
  n = Math.min(n, hay);
  if(pagar){
    const costo = tipo === "A" ? 5*n : n;
    if(F.sangre < costo) throw new ReglaError(`Curar ${n} nivel(es) ${TIPO_DANO[tipo]} cuesta ${costo} de Sangre y ${F.nombre} tiene ${F.sangre}.`);
    gastarSangre(costo, tipo === "A" ? "curar agravado" : "curación", true);
  }
  for(let i=0;i<n;i++){ const idx = F.salud.lastIndexOf(tipo); F.salud.splice(idx,1); }
  if(F.estado === "letargo" && F.salud.length < 7) F.estado = "activo";
  evento("curacion", {niveles:n, tipo, pagado:!!pagar, salud:[...F.salud], modo:"mesa"});
  return n;
}

async function tirarRasgos(){
  const ft = foto();
  if(J.esp === "iniciativa") return tirarIniciativa();
  if(J.esp === "absorcion") return tirarAbsorcion();
  let r; try { activo(); r = reservaJ(); } catch(e){ return accion(() => { throw e; }); }
  if(r.n < 1) return;
  const sinFV = J.a === "conciencia" && !J.b && J.dif === "8";
  let auto = r.auto || 0;
  if(J.fv){ if(sinFV) return avisoJuego("En la tirada de Degeneración no se puede gastar Fuerza de Voluntad.");
    try { gastarFV("éxito automático"); auto += 1; } catch(e){ return accion(() => { throw e; }); } }
  $("#j-tirar").disabled = true;
  const out = $("#j-out"); out.innerHTML = '<div class="droll"></div><div class="res"></div>';
  await animarDados(out.querySelector(".droll"), r.n);
  const dados = Array.from({length:r.n}, d10).sort((a,b) => b - a), dif = J.dif ? Number(J.dif) : null;
  let res, linea;
  const esp = !!(J.espec && espTirada());
  if(dif){ const t = exitosCon(dados, dif, auto, esp); res = t.texto === "fracaso" ? "Fracaso total" : t.texto === "fallo" ? "Fallo" : t.texto; }
  else res = "Sin dificultad: " + [6,7,8,9].map(d => `dif. ${d}: ${exitosCon(dados, d, auto, esp).texto}`).join(" · ");
  out.querySelector(".droll").innerHTML = carasDados(dados, dif, dif ? anuladosDe(dados, dif, esp) : 0, esp) + Array.from({length:r.auto||0}, () => '<div class="d10 auto">POT</div>').join("") + (auto > (r.auto||0) ? '<div class="d10 auto">FV</div>' : "");
  const rr = out.querySelector(".res"); rr.textContent = res; rr.className = "res " + (dif && /éxito/.test(res) ? "good" : dif ? "bad" : "");
  linea = `${r.titulo} (${r.n} dados${dif ? ", dif. "+dif : ""}${auto > (r.auto||0) ? ", +1 FV" : ""}${esp ? ", Especialidad "+espTirada() : ""}): [${dados.join(", ")}] → ${res}`;
  evento("tirada_mesa", {titulo:r.titulo, dados, dificultad:dif, fv:!!auto, resultado:res});
  const fvGastada = auto > (r.auto||0);
  if(fvGastada){ guardarFicha(); refrescarCabecera(); flash("m-fv"); }
  anotarMesa(linea); J.out = out.innerHTML;
  $("#j-tirar").disabled = false; J.fv = false; const c = $("#j-fv"); if(c) c.setAttribute("aria-pressed", "false");
  if(fvGastada) mostrarDeshacer("Tirada · −1 FV", ft);
}

function diferencias(a, b, pref=""){
  const out = [];
  const claves = new Set([...Object.keys(a||{}), ...Object.keys(b||{})]);
  for(const k of claves){
    if(k.startsWith("_") || ["poderes","salud","revision_narrador","puntos_gratuitos","creado"].includes(k)) continue;
    const x = a?.[k], y = b?.[k];
    if(typeof x === "string" || typeof y === "string"){ if((x||"") !== (y||"")) out.push(`${lab(k)}: «${x||""}» → «${y||""}»`); continue; }
    if(typeof x === "number" || typeof y === "number"){ if((x||0) !== (y||0)) out.push(`${lab(k)} ${x||0} → ${y||0}`); }
    else if((x || y) && typeof (x || y) === "object" && !Array.isArray(x || y)) out.push(...diferencias(x || {}, y || {}));
    else if(Array.isArray(x) || Array.isArray(y)){ const nx = (x||[]).map(i => i.nombre).join(", "), ny = (y||[]).map(i => i.nombre).join(", "); if(nx !== ny) out.push(`${lab(k)}: ${nx || "—"} → ${ny || "—"}`); }
  }
  return out;
}
function guardarEdicion(){
  const cambios = diferencias(F, EDIT), motivo = (EDIT._motivo||"").trim();
  if(!cambios.length){ EDIT = null; renderFicha(); return; }

  for(const h of Object.keys(nuevo.habilidades||{})) if(!nuevo.habilidades[h]) delete nuevo.habilidades[h];
  for(const t of Object.keys(nuevo.trasfondos||{})) if(!nuevo.trasfondos[t]) delete nuevo.trasfondos[t];
  if(JSON.stringify(nuevo.disciplinas) !== JSON.stringify(F.disciplinas)) nuevo.poderes = poderesDe(nuevo.disciplinas || {});
  const [, reserva] = GEN[nuevo.generacion] || GEN[13]; nuevo.sangre = Math.min(nuevo.sangre, reserva);
  F = nuevo; EDIT = null;
  evento("edicion_manual", {motivo, cambios});
  anotarMesa(`Ficha editada (${motivo}): ${cambios.join("; ")}`);
  guardarFicha(); refrescarCabecera(); renderFicha(); avisoJuego("Ficha guardada");
}

/* ---------- experiencia (costos de claude/00-reglas-de-mesa.md) ---------- */
function costoXP(tipo, actual, deClan){
  if(tipo === "atributo") return actual * 4;
  if(tipo === "habilidad") return actual === 0 ? 3 : actual * 2;
  if(tipo === "disciplina") return actual === 0 ? 10 : (F.clan === "caitiff" ? actual * 6 : actual * (deClan ? 5 : 7));
  if(tipo === "virtud" || tipo === "humanidad") return actual * 2;
  if(tipo === "fuerza_voluntad") return actual;
  throw new ReglaError("Tipo de Rasgo desconocido.");
}

/* =====================================================================
   Dado rápido: botón flotante en todas las pantallas
   Los 10 se muestran como 0. Un 1 tocado descarta el dado más alto (ambos en gris).
   Un 0 tocado agrega un dado nuevo (borde verde): la regla del 10 que repite.
   ===================================================================== */
const DR = {n:5, dados:[]};   // dados: [{v, desc:false, par:null, usado:false, extra:false}]
function posFab(){
  const app = $("#app"), fab = $("#fab-dado"); if(!app || !fab) return;
  const comp = $("#composer"), tope = (!comp.hidden ? comp : $("#tabs")).getBoundingClientRect().top;
  const b = Math.max(12, app.getBoundingClientRect().bottom - tope + 12) + "px";
  fab.style.bottom = b; const u = $("#undo"); if(u) u.style.bottom = b;
}
function caraRapida(d, i){
  const cls = d.desc ? "gris" : d.v === 1 ? "uno" : (d.v === 10 && !d.usado) ? "cero" : "";
  return `<span class="drw ${d.desc ? "anulado" : d.extra ? "extra" : ""}"><button type="button" class="d10 dr ${cls}" data-dr="${i}" aria-label="Dado ${d.v === 10 ? 0 : d.v}${d.extra ? ", extra" : ""}${d.desc ? ", descartado" : ""}">${d.v === 10 ? 0 : d.v}</button></span>`;
}
function pintarRapida(){
  const caja = $("#dr-res"); if(!caja) return;
  if(!DR.dados.length){ caja.innerHTML = ""; return; }
  const vivos = DR.dados.filter(d => !d.desc).length, extras = DR.dados.filter(d => d.extra).length;
  caja.innerHTML = `<div class="droll">${DR.dados.map(caraRapida).join("")}</div>
    <p class="pen" style="margin:0">${DR.dados.length} dado${DR.dados.length>1?"s":""}${extras ? ` (${extras} extra)` : ""} · ${vivos} sin descartar. Tocá un 1 para descartar el más alto y un 0 para tirar otro dado, o usá los botones de arriba.</p>`;
  caja.querySelectorAll("[data-dr]").forEach(b => b.onclick = () => tocarRapido(+b.dataset.dr));
  estadoAutos();
}
function tocarRapido(i){
  const d = DR.dados[i];
  if(d.v === 1){
    if(d.desc){ const o = DR.dados[d.par]; d.desc = false; d.par = null; if(o){ o.desc = false; o.par = null; } return pintarRapida(); }
    let mejor = -1;
    DR.dados.forEach((x, j) => { if(j !== i && !x.desc && x.v !== 1 && (mejor < 0 || x.v > DR.dados[mejor].v)) mejor = j; });
    if(mejor < 0){ avisoJuego("No queda ningún dado para descartar."); return; }
    d.desc = true; d.par = mejor; DR.dados[mejor].desc = true; DR.dados[mejor].par = i;
    return pintarRapida();
  }
  if(d.v === 10 && !d.usado && !d.desc){
    d.usado = true; DR.dados.push({v:d10(), desc:false, par:null, usado:false, extra:true});
    pintarRapida();
  }
}
// Botones que aplican de una vez todos los 1 (cada uno anula el dado más alto) y todos los 10 (cada uno suma un dado).
const unosPendientes = () => DR.dados.some((d, i) => d.v === 1 && !d.desc && DR.dados.some((x, j) => j !== i && !x.desc && x.v !== 1));
const diecesPendientes = () => DR.dados.some(d => d.v === 10 && !d.usado && !d.desc);
function estadoAutos(){ const u = $("#dr-unos"), z = $("#dr-dieces"); if(u) u.disabled = !unosPendientes(); if(z) z.disabled = !diecesPendientes(); }
function aplicarUnos(){
  let vueltas = 0;
  while(unosPendientes() && vueltas++ < 40){
    const i = DR.dados.findIndex((d, k) => d.v === 1 && !d.desc && DR.dados.some((x, j) => j !== k && !x.desc && x.v !== 1));
    let mejor = -1; DR.dados.forEach((x, j) => { if(j !== i && !x.desc && x.v !== 1 && (mejor < 0 || x.v > DR.dados[mejor].v)) mejor = j; });
    if(mejor < 0) break;
    DR.dados[i].desc = true; DR.dados[i].par = mejor; DR.dados[mejor].desc = true; DR.dados[mejor].par = i;
  }
  pintarRapida();
}
function aplicarDieces(){
  let vueltas = 0;
  while(diecesPendientes() && vueltas++ < 40){ const d = DR.dados.find(x => x.v === 10 && !x.usado && !x.desc); d.usado = true; DR.dados.push({v:d10(), desc:false, par:null, usado:false, extra:true}); }
  pintarRapida();
}
async function tirarRapido(){
  const n = DR.n; DR.dados = [];
  const caja = $("#dr-res"); caja.innerHTML = '<div class="droll"></div>';
  await animarDados(caja.querySelector(".droll"), n);
  DR.dados = Array.from({length:n}, d10).sort((a,b) => b - a).map(v => ({v, desc:false, par:null, usado:false, extra:false}));
  pintarRapida();
}

// Espera la respuesta del servidor (no la copia local vacía) antes de dar un documento por inexistente.
function cargarDoc(path){
  return new Promise((ok, mal) => {

    const fin = v => { if(listo) return; listo = true; clearTimeout(t); try{ unsub(); }catch(_){} ok(v); };
    const t = setTimeout(() => fin(ultimo), 12000);
    unsub = DB.doc(path).onSnapshot(s => {
      ultimo = s.exists ? JSON.parse(JSON.stringify(s.data())) : null;
      if(!s.metadata.fromCache || s.exists) fin(ultimo);

  });
}

/* =====================================================================
   Motor del Narrador intercambiable
   Un motor es una función (input, opts) con .json(prompt, opts) y .limits(), igual que el
   "sample" de Claude. El resto de la app solo conoce SAMPLE; acá se decide cuál es.
   Los motores gratuitos hablan el protocolo OpenAI (/chat/completions); la clave de cada
   jugador queda solo en su navegador.
   ===================================================================== */
const MOTORES = {
  claude:     {nombre:"Claude (tu cuenta)", nota:"Sin clave. Usa tu plan de Claude; solo funciona dentro de Claude."},
  groq:       {nombre:"Groq (gratis)", base:"https://api.groq.com/openai/v1", modelo:"openai/gpt-oss-120b", nota:"Clave gratis y sin tarjeta.", enlace:"https://console.groq.com/keys"},
  gemini:     {nombre:"Gemini (Google AI Studio)", base:"https://generativelanguage.googleapis.com/v1beta/openai", modelo:"gemini-2.5-flash", nota:"Clave gratis, con límites diarios que Google cambia seguido.", enlace:"https://aistudio.google.com/apikey"},
  openrouter: {nombre:"OpenRouter (modelos :free)", base:"https://openrouter.ai/api/v1", modelo:"", nota:"El modelo debe terminar en :free. Tiene pocos pedidos por día.", enlace:"https://openrouter.ai/keys"},
  xai:        {nombre:"Grok (xAI)", base:"https://api.x.ai/v1", modelo:"grok-4.1-fast", nota:"De pago: no tiene versión gratuita.", enlace:"https://console.x.ai"},
  anthropic:  {nombre:"Claude (API de Anthropic)", base:"https://api.anthropic.com/v1", modelo:"claude-sonnet-5-5", protocolo:"anthropic", nota:"De pago. No es tu plan de Claude: la API se paga aparte, por uso.", enlace:"https://console.anthropic.com/settings/keys"},
  otro:       {nombre:"Otro compatible con OpenAI", base:"", modelo:"", nota:"Cualquier servicio con /chat/completions (incluye Ollama en tu compu)."}
};
let MOTOR = {tipo:"claude"}, SAMPLE_CLAUDE = null, TOOLS_CLAUDE = 0;
try { MOTOR = JSON.parse(localStorage.getItem("bbn_ia") || "null") || MOTOR; } catch(_){}
const errIA = (code, message, extra) => Object.assign(new Error(message || code), {code}, extra);

const dormir = (ms, signal) => new Promise((ok, mal) => {
  const t = setTimeout(ok, ms);
  signal?.addEventListener("abort", () => { clearTimeout(t); mal(errIA("cancelled")); }, {once:true});
});
// Cuántos segundos pide esperar el servicio: cabecera retry-after o «try again in 8.2s» en el mensaje.
function esperaPedida(r, t){
  const h = parseFloat(r.headers.get("retry-after")); if(h > 0) return h;
  const m = /try again in\s+(?:(\d+)m)?\s*([\d.]+)s/i.exec(t || "");
  return m ? (Number(m[1] || 0) * 60 + parseFloat(m[2])) : 0;
}
async function pedirIA({url, headers, body, signal, nombre, alEsperar}){
  for(let intento = 0; ; intento++){
    let r;
    try { r = await fetch(url, {method:"POST", headers, body:JSON.stringify(body), signal}); }
    catch(e){ if(e.name === "AbortError") throw errIA("cancelled"); throw errIA("red", "No se pudo conectar con " + nombre + ". " + e.message); }
    if(r.ok) return r;
    const t = await r.text().catch(() => "");
    if(r.status === 429){
      const espera = esperaPedida(r, t), diario = /per day|TPD|RPD/i.test(t);
      // Límite por minuto: esperar lo que pide el servicio y reintentar (hasta 2 veces, máx. 60 s cada una).
      if(!diario && espera > 0 && espera <= 60 && intento < 2){ try { alEsperar?.(Math.ceil(espera)); } catch(_){} await dormir(Math.ceil(espera * 1000) + 500, signal); continue; }
      throw errIA("rate_limited", t.slice(0, 300), {espera:Math.ceil(espera), diario});
    }
    throw errIA(r.status === 401 || r.status === 403 ? "auth" : r.status === 413 ? "prompt_too_large" : "http_" + r.status, t.slice(0, 300));
  }
}
async function leerSSE(r, alDato){
  const rd = r.body.getReader(), dec = new TextDecoder(); let buf = "";
  for(;;){
    let c; try { c = await rd.read(); } catch(e){ throw errIA(e.name === "AbortError" ? "cancelled" : "red", e.message); }
    if(c.done) break;
    buf += dec.decode(c.value, {stream:true});
    let i; while((i = buf.indexOf("\n")) >= 0){
      const linea = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
      if(!linea.startsWith("data:")) continue;
      const dato = linea.slice(5).trim(); if(!dato || dato === "[DONE]") continue;
      let j; try { j = JSON.parse(dato); } catch(_){ continue; }
      alDato(j);
    }
  }
}
const SOLO_JSON = "\n\nRespondé SOLO con un objeto JSON válido, sin texto antes ni después ni bloques de código.";
function jsonDeTexto(t){
  const a = t.indexOf("{"), b = t.lastIndexOf("}");
  try { return JSON.parse(t.slice(a, b + 1)); } catch(_){ throw errIA("json", "El modelo no devolvió JSON válido."); }
}
const entrada = input => (typeof input === "string" ? [{role:"user", content:input}] : input).map(m => ({role:m.role, content:m.content}));
const jsonSeguro = t => { try { return JSON.parse(t || "{}"); } catch(_){ return {}; } };

// Protocolo OpenAI (/chat/completions): Groq, Gemini, OpenRouter, xAI, Ollama…
function crearMotorOpenAI(cfg){
  const url = (cfg.base || "").replace(/\/+$/, "") + "/chat/completions";
  const headers = {"Content-Type":"application/json", ...(cfg.clave ? {Authorization:"Bearer " + cfg.clave} : {})};
  const nombre = MOTORES[cfg.tipo]?.nombre || "el servicio";
  let alEsperar = null;
  const pedir = (body, signal) => pedirIA({url, headers, body, signal, nombre, alEsperar});
  async function ask(input, opts = {}){
    alEsperar = opts.onEspera || null;
    const msgs = entrada(input);
    const tools = (opts.tools || []).map(t => ({type:"function", function:{name:t.name, description:t.description, parameters:t.inputSchema || {type:"object", properties:{}}}}));
    let acumulado = "";
    for(let vuelta = 0; vuelta < 8; vuelta++){
      const body = {model:cfg.modelo, messages:msgs, stream:true};
      if(/gpt-oss/i.test(cfg.modelo)) body.reasoning_effort = "low";  // menos tokens de «pensar»: cuentan contra el límite por minuto
      if(tools.length) body.tools = tools;
      const r = await pedir(body, opts.signal);
      let texto = "", llamadas = [];
      await leerSSE(r, j => {
        const d = j.choices?.[0]?.delta; if(!d) return;
        if(d.content){ texto += d.content; opts.onText && opts.onText({text:acumulado + texto, delta:d.content}); }
        for(const tc of d.tool_calls || []){
          const k = tc.index ?? 0, c = llamadas[k] ||= {id:"", name:"", args:""};
          if(tc.id) c.id = tc.id; if(tc.function?.name) c.name += tc.function.name; if(tc.function?.arguments) c.args += tc.function.arguments;
        }
      });
      acumulado += texto;
      llamadas = llamadas.filter(c => c && c.name);
      if(!llamadas.length) return {text:acumulado};
      const ids = llamadas.map((c, n) => c.id || "call_" + vuelta + "_" + n);
      msgs.push({role:"assistant", content:texto || null, tool_calls:llamadas.map((c, n) => ({id:ids[n], type:"function", function:{name:c.name, arguments:c.args || "{}"}}))});
      let cierra = false;
      for(let n = 0; n < llamadas.length; n++){
        const c = llamadas[n], t = (opts.tools || []).find(x => x.name === c.name); let res;
        try { if(!t) throw new Error("Herramienta desconocida: " + c.name); res = await t.execute(jsonSeguro(c.args)); if(t.cierraTurno) cierra = true; }
        catch(e){ res = "Error: " + (e.message || e); }
        msgs.push({role:"tool", tool_call_id:ids[n], content:typeof res === "string" ? res : JSON.stringify(res ?? "ok")});
      }
      if(opts.signal?.aborted) throw errIA("cancelled");
      if(cierra) return {text:acumulado};  // p. ej. tirada pedida: ahora le toca al jugador, no hace falta otra vuelta
    }
    return {text:acumulado};
  }
  ask.json = async (prompt, opts = {}) => {
    const msgs = [{role:"user", content:prompt + SOLO_JSON}];
    const extra = /gpt-oss/i.test(cfg.modelo) ? {reasoning_effort:"low"} : {};
    let r; try { r = await pedir({model:cfg.modelo, messages:msgs, response_format:{type:"json_object"}, ...extra}, opts.signal); }
    catch(e){ if(!/^http_4/.test(e.code)) throw e; r = await pedir({model:cfg.modelo, messages:msgs, ...extra}, opts.signal); }
    return jsonDeTexto((await r.json()).choices?.[0]?.message?.content || "");
  };
  ask.limits = async () => ({tools:{maxCount:0}});
  return ask;
}

// Protocolo de Anthropic (/v1/messages), con la clave del propio jugador.
function crearMotorAnthropic(cfg){
  const url = (cfg.base || "https://api.anthropic.com/v1").replace(/\/+$/, "") + "/messages";
  const headers = {"Content-Type":"application/json", "x-api-key":cfg.clave, "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true"};
  let alEsperar = null;
  const pedir = (body, signal) => pedirIA({url, headers, body, signal, nombre:"Claude", alEsperar});
  async function ask(input, opts = {}){
    alEsperar = opts.onEspera || null;
    const msgs = entrada(input);
    const tools = (opts.tools || []).map(t => ({name:t.name, description:t.description, input_schema:t.inputSchema || {type:"object", properties:{}}}));
    let acumulado = "";
    for(let vuelta = 0; vuelta < 8; vuelta++){
      const body = {model:cfg.modelo, max_tokens:2048, messages:msgs, stream:true};
      if(tools.length) body.tools = tools;
      const r = await pedir(body, opts.signal);
      const bloques = []; let parada = "";
      const textoActual = () => bloques.filter(b => b?.type === "text").map(b => b.text).join("");
      await leerSSE(r, j => {
        if(j.type === "content_block_start"){
          const b = j.content_block || {};
          bloques[j.index] = b.type === "tool_use" ? {type:"tool_use", id:b.id, name:b.name, json:""} : {type:"text", text:""};
        } else if(j.type === "content_block_delta"){
          const b = bloques[j.index]; if(!b) return;
          if(j.delta?.type === "text_delta"){ b.text += j.delta.text; opts.onText && opts.onText({text:acumulado + textoActual(), delta:j.delta.text}); }
          else if(j.delta?.type === "input_json_delta") b.json += j.delta.partial_json;
        } else if(j.type === "message_delta" && j.delta?.stop_reason) parada = j.delta.stop_reason;
        else if(j.type === "error") throw errIA("http_error", j.error?.message || "error");
      });
      acumulado += textoActual();
      const usos = bloques.filter(b => b?.type === "tool_use");
      if(parada !== "tool_use" || !usos.length) return {text:acumulado};
      msgs.push({role:"assistant", content:bloques.filter(b => b && (b.type === "tool_use" || b.text.trim())).map(b => b.type === "text" ? {type:"text", text:b.text} : {type:"tool_use", id:b.id, name:b.name, input:jsonSeguro(b.json)})});
      const resultados = []; let cierra = false;
      for(const u of usos){
        const t = (opts.tools || []).find(x => x.name === u.name); let res, error = false;
        try { if(!t) throw new Error("Herramienta desconocida: " + u.name); res = await t.execute(jsonSeguro(u.json)); if(t.cierraTurno) cierra = true; }
        catch(e){ res = "Error: " + (e.message || e); error = true; }
        resultados.push({type:"tool_result", tool_use_id:u.id, content:typeof res === "string" ? res : JSON.stringify(res ?? "ok"), ...(error ? {is_error:true} : {})});
      }
      msgs.push({role:"user", content:resultados});
      if(opts.signal?.aborted) throw errIA("cancelled");
      if(cierra) return {text:acumulado};  // p. ej. tirada pedida: ahora le toca al jugador, no hace falta otra vuelta
    }
    return {text:acumulado};
  }
  ask.json = async (prompt, opts = {}) => {
    const r = await pedir({model:cfg.modelo, max_tokens:4096, messages:[{role:"user", content:prompt + SOLO_JSON}]}, opts.signal);
    return jsonDeTexto(((await r.json()).content || []).filter(b => b.type === "text").map(b => b.text).join(""));
  };
  ask.limits = async () => ({tools:{maxCount:0}});
  return ask;
}

/* =====================================================================
   Plataforma
   Dentro de Claude: base y Narrador de Claude. Como sitio propio: todo se guarda en este dispositivo
   (IndexedDB, con localStorage de reserva) y el Narrador usa la clave del jugador.
   El adaptador local imita la interfaz mínima de la base de Claude que usa crearDB().
   ===================================================================== */
let PLATAFORMA = "claude";
async function crearAlmacenLocal(){
  const PREF = "vv20:", mem = new Map(), oyentes = new Map();
  let idb = null, cola = Promise.resolve();
  const abrir = () => new Promise((ok, mal) => {
    const r = indexedDB.open("vampirov20", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("docs");
    r.onsuccess = () => ok(r.result); r.onerror = () => mal(r.error); r.onblocked = () => mal(new Error("bloqueada"));
  });
  const cargar = () => new Promise((ok, mal) => {
    const t = idb.transaction("docs", "readonly"), st = t.objectStore("docs"), ks = st.getAllKeys(), vs = st.getAll();
    t.oncomplete = () => { ks.result.forEach((k, i) => mem.set(k, vs.result[i])); ok(); }; t.onerror = () => mal(t.error);
  });
  const escribirIDB = (path, v) => new Promise((ok, mal) => {
    const t = idb.transaction("docs", "readwrite"); v === null ? t.objectStore("docs").delete(path) : t.objectStore("docs").put(v, path);
    t.oncomplete = () => ok(); t.onerror = t.onabort = () => mal(t.error);
  });
  try { idb = await abrir(); await cargar(); } catch(e){ console.warn("IndexedDB no disponible; uso localStorage", e); idb = null; }
  // Lo que haya quedado en localStorage (reserva) se suma y, si IndexedDB anda, se pasa a ella.
  try {
    for(let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i); if(!k || !k.startsWith(PREF)) continue;
      const path = k.slice(PREF.length); if(mem.has(path)) continue;
      try { mem.set(path, JSON.parse(localStorage.getItem(k))); } catch(_){}
    }
  } catch(_){}
  if(idb){ try { for(const [path, v] of mem) await escribirIDB(path, v); const viejas = []; for(let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if(k && k.startsWith(PREF)) viejas.push(k); } viejas.forEach(k => localStorage.removeItem(k)); } catch(_){} }
  try { navigator.storage?.persist?.().catch(() => {}); } catch(_){}

  const guardar = async (path, v) => {
    if(idb){ try { await escribirIDB(path, v); return; } catch(e){ console.warn("IndexedDB falló; paso a localStorage", e); idb = null; } }
    try { v === null ? localStorage.removeItem(PREF + path) : localStorage.setItem(PREF + path, JSON.stringify(v)); }
    catch(e){ console.warn("localStorage", e); throw e; }
  };
  const persistir = path => { const v = mem.get(path), p = cola.catch(() => {}).then(() => guardar(path, v === undefined ? null : v)); cola = p; return p; };
  const copia = v => JSON.parse(JSON.stringify(v));
  const snap = (path, pendiente) => { const v = mem.get(path); return {exists:v !== undefined, id:path.split("/").pop(), metadata:{fromCache:false, hasPendingWrites:!!pendiente}, data:() => v === undefined ? undefined : copia(v)}; };
  const avisar = path => (oyentes.get(path) || []).forEach(fn => { try { fn(snap(path, true)); } catch(_){} });
  const doc = path => ({
    get: async () => snap(path, false),
    set: d => { mem.set(path, copia(d)); avisar(path); return persistir(path); },
    update: d => { mem.set(path, {...(mem.get(path) || {}), ...copia(d)}); avisar(path); return persistir(path); },
    delete: () => { mem.delete(path); avisar(path); return persistir(path); },
    onSnapshot: (fn, err) => { const s = oyentes.get(path) || new Set(); oyentes.set(path, s); s.add(fn); Promise.resolve().then(() => { if(s.has(fn)) fn(snap(path, false)); }); return () => s.delete(fn); }
  });
  const collection = prefijo => ({where: (campo, op, valor) => ({get: async () => ({docs:[...mem.entries()]
    .filter(([k, v]) => k.startsWith(prefijo + "/") && v && v[campo] === valor)
    .map(([k, v]) => ({id:k.slice(prefijo.length + 1), data:() => copia(v)}))})})});
  return {doc, collection};
}
// Perfil local: un id que se genera una sola vez (se guarda en la base y en localStorage) y un nombre opcional.
async function perfilLocal(raw){
  let id = "", nombre = "";
  try { const s = await raw.doc("__perfil").get(); if(s.exists){ id = s.data().id || ""; nombre = s.data().nombre || ""; } } catch(_){}
  if(!id){ try { id = localStorage.getItem("vv20_uid") || ""; } catch(_){} }
  if(!id) id = (crypto.randomUUID ? crypto.randomUUID() : "u" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10)).replace(/[^A-Za-z0-9]/g, "");
  try { await raw.doc("__perfil").set({id, nombre}); } catch(_){}
  try { localStorage.setItem("vv20_uid", id); } catch(_){}
  return {id: async () => id, me: async () => ({id, name:nombre}), isOwner: () => true, canEdit: () => true,
    setNombre: async n => { nombre = String(n || ""); try { await raw.doc("__perfil").set({id, nombre}); } catch(_){} }};
}

let escuchas = [];
async function conectar(){
  if(DB) return true;
  if(typeof window.claude?.use === "function"){
    PLATAFORMA = "claude";
    try { RAW = await window.claude?.use?.("db"); } catch(_){ RAW = null; }
    try { USER = await window.claude?.use?.("user"); } catch(_){ USER = null; }
    try { YO = USER ? await USER.id() : null; } catch(_){ YO = null; }
    if(!RAW || !YO) return false;
    DB = crearDB(RAW);
    try { DESCARGAS = await window.claude?.use?.("downloads"); } catch(_){ DESCARGAS = null; }
    try { SAMPLE_CLAUDE = await window.claude?.use?.("sample"); } catch(_){ SAMPLE_CLAUDE = null; }
    if(SAMPLE_CLAUDE){ try { const lim = await SAMPLE_CLAUDE.limits(); TOOLS_CLAUDE = lim?.tools?.maxCount || 0; if(!lim?.tools) SAMPLE_CLAUDE = null; } catch(_){} }
  } else {
    PLATAFORMA = "local";
    try { RAW = await crearAlmacenLocal(); USER = await perfilLocal(RAW); YO = await USER.id(); } catch(e){ console.warn("almacén local", e); RAW = null; }
    if(!RAW || !YO) return false;
    DB = crearDB(RAW); DESCARGAS = null; SAMPLE_CLAUDE = null;
    if(MOTOR.tipo === "claude") MOTOR = {tipo:"groq", base:MOTORES.groq.base, modelo:MOTORES.groq.modelo, clave:""};
  }
  elegirMotor();
  return true;
}
