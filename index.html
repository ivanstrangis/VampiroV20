const FORMATO_RESPALDO = "vampirov20-respaldo";
const CAMPOS_PJ = {personajes:"ficha", inventario:"inventario", conocimiento:"conocimiento", notas:"notas", mundo:"mundo"};
async function leerDoc(path){ try { const s = await DB.doc(path).get(); return s.exists ? clonar(s.data()) : null; } catch(_){ return null; } }
async function mensajesDe(id){
  try { const s = await DB.collection("mensajes_" + id).get(); return s.docs.map(d => clonar(d.data())).sort((a, b) => a.n - b.n); }
  catch(_){ return []; }
}
async function respaldarTodo(){
  if(!DB) return;
  cerrarSheet(); sysMsg("Armando el respaldo…", "", false);
  const out = {formato:FORMATO_RESPALDO, version:1, exportado:new Date().toISOString(), personajes:[], cronicas:[]}, vistas = new Set();
  const cronica = async cid => {
    if(vistas.has(cid)) return; vistas.add(cid);
    const [meta, director, cron] = await Promise.all([leerDoc("cronicas/" + cid), leerDoc("director/" + cid), leerDoc("cronica/" + cid)]);
    if(meta || director || cron) out.cronicas.push({id:cid, meta, director, cronica:cron});
  };
  for(const p of await listarPersonajes()){
    const datos = {id:p.id};
    for(const [col, campo] of Object.entries(CAMPOS_PJ)) datos[campo] = await leerDoc(col + "/" + p.id);
    if(!datos.ficha) continue;
    datos.mensajes = await mensajesDe(p.id);
    out.personajes.push(datos);
    await cronica(datos.mundo?.cronica_id || p.id);
  }
  for(const c of await listarCronicas()) await cronica(c.id);
  await guardarArchivo(`vampirov20-respaldo-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(out),
    `Respaldo guardado: ${out.personajes.length} personaje(s) y ${out.cronicas.length} crónica(s).`);
}
const idValido = id => typeof id === "string" && /^[A-Za-z0-9_]+$/.test(id);
const respaldoValido = d => d?.formato === FORMATO_RESPALDO && Array.isArray(d.personajes) && d.personajes.every(p => idValido(p.id) && p.ficha?.atributos) && (d.cronicas || []).every(c => idValido(c.id));
function confirmarRespaldo(d){
  abrirSheet(`<h2>Restaurar respaldo</h2>
  <p class="pen">El archivo trae ${d.personajes.length} personaje(s) y ${(d.cronicas || []).length} crónica(s). Si alguno ya existe en este dispositivo, se reemplaza.</p>
  <p class="err" id="rb-err" role="alert"></p>
  <div class="row"><button class="btn ghost" type="button" id="rb-x">Cancelar</button><button class="btn" type="button" id="rb-ok">Restaurar</button></div>`, () => {
    $("#rb-x").onclick = cerrarSheet; $("#rb-ok").onclick = () => restaurarRespaldo(d);
  });
}
async function restaurarRespaldo(d){
  const btn = $("#rb-ok"); if(btn){ btn.disabled = true; btn.textContent = "Restaurando…"; }
  try {
    for(const p of d.personajes){
      for(const [col, campo] of Object.entries(CAMPOS_PJ)) if(p[campo]) await DB.doc(col + "/" + p.id).set(clonar(p[campo]));
      for(const m of p.mensajes || []) if(m && Number.isFinite(Number(m.n))) await DB.doc("mensajes_" + p.id + "/m" + m.n).set(clonar(m));
    }
    for(const c of d.cronicas || []){
      if(c.meta) await DB.doc("cronicas/" + c.id).set(clonar(c.meta));
      if(c.director) await DB.doc("director/" + c.id).set(clonar(c.director));
      if(c.cronica) await DB.doc("cronica/" + c.id).set(clonar(c.cronica));
    }
  } catch(e){ const er = $("#rb-err"); if(er) er.textContent = "No se pudo restaurar (" + (e.code || e.message || "error") + ")."; if(btn){ btn.disabled = false; btn.textContent = "Restaurar"; } return; }
  sysMsg(`Respaldo restaurado: ${d.personajes.length} personaje(s) y ${(d.cronicas || []).length} crónica(s).`, "rule", false);
  await cambiarPersonaje(d.personajes[0]?.id || PJ);
}

async function iniciar(){
  if(!(await conectar())) return sinBase(PLATAFORMA === "local" ? "No se pudo abrir el guardado de este navegador. Revisá que no esté en modo privado ni con el almacenamiento bloqueado." : "Abrí esta página dentro de claude.ai con tu sesión iniciada. Si te la compartieron, pedí permiso para usarla, no solo para verla.");
  if(!PJ){
    const mios = (await listarPersonajes()).filter(p => !p.hoja_de_jugador);
    if(!mios.length){ F = null; return pantallaVacia(); }
    PJ = mios.sort((a,b) => String(a.creado||"").localeCompare(String(b.creado||"")))[0].id;
  }
  try {
    [F, INV, CON, MUNDO, NOTAS] = await Promise.all([R.ficha(), R.inv(), R.con(), R.mundo(), R.notas()].map(cargarDoc));
    MUNDO ||= {};
    [GUIA, CRONICA, CRON] = await Promise.all([R.guia(), R.cron(), R.meta()].map(cargarDoc));
  } catch(e){ return sinBase("No se pudo leer la partida ("+(e.code||"error")+"). Recargá la página."); }
  if(!F){ PJ = ""; try { localStorage.removeItem("bbn_pj"); } catch(_){} return iniciar(); }
  $("#tabs").hidden = false; $("#fab-dado").hidden = false;
  CRONICA ||= {noches:[]};
  F.nombre ||= PJ;
  // Personajes anteriores a las crónicas separadas: su crónica es la suya (mismo id).
  if(!MUNDO.cronica_id && (GUIA?.premisa || GUIA?.texto)){ MUNDO.cronica_id = PJ; guardarMundo(); }
  if(MUNDO.cronica_id && !CRON){ CRON = {nombre:"Crónica de " + (F.nombre || PJ), tipo:"libre", idea:"", creada:new Date().toISOString()}; escribir(R.meta(), CRON); }
  EDIT = null;
  $("#composer").hidden = $("#s-chat").hidden;
  INV ||= {items:[]}; CON ||= {hechos:[]}; MUNDO ||= {}; GUIA ||= {texto:"", pnj:[]}; NOTAS ||= {texto:""};
  F.salud ||= [];
  INV.items.forEach(o => { normArma(o); o.lugar ||= ENCIMA; });
  refrescarCabecera();
  aplicarModo();
  try {
    const snap = await DB.collection(R.msgs()).get();
    MSGS = snap.docs.map(d => JSON.parse(JSON.stringify(d.data()))).sort((a,b) => a.n - b.n).slice(-200);
  } catch(e){ MSGS = []; }
  lastN = Math.max(lastN, ...MSGS.map(m => Math.ceil(m.n)||0));
  chat.innerHTML = "";
  for(const m of MSGS){ if(m.oculto) continue; const el = renderMsg(m); if(el){ el.dataset.n = m.n; chat.appendChild(el); } }
  if(!MSGS.length && !modoMesa()) bienvenida();
  mostrarPestana("chat");
  renderChips(); scrollChat();
  // Cambios que haga el Director desde el proyecto aparecen sin recargar
  cortarEscuchas();
  const pj = PJ;
  const vivo = (path, set) => { try { escuchas.push(DB.doc(path).onSnapshot(s => { if(pj !== PJ || s.metadata.hasPendingWrites || running || pend[path] > 0 || !s.exists) return; set(JSON.parse(JSON.stringify(s.data()))); refrescarCabecera(); })); } catch(_){} };
  vivo(R.ficha(), v => { F = v; F.salud ||= []; }); vivo(R.inv(), v => { INV = v; INV.items.forEach(o => { normArma(o); o.lugar ||= ENCIMA; }); }); vivo(R.con(), v => CON = v);
  vivo(R.guia(), v => GUIA = v);
}
function cortarEscuchas(){ escuchas.forEach(u => { try { typeof u === "function" ? u() : u?.unsubscribe?.(); } catch(_){} }); escuchas = []; }
async function cambiarPersonaje(id){
  if(running){ sysMsg("Esperá a que el Narrador termine antes de cambiar de personaje.", "", false); return; }
  cerrarSheet();
  PJ = id; try { localStorage.setItem("bbn_pj", id); } catch(_){}
  cortarEscuchas();
  F = null; MSGS = []; MUNDO = {}; INV = {items:[]}; CON = {hechos:[]};
  $("#pj-nombre").textContent = "Cargando…";
  mostrarPestana("chat");
  chat.innerHTML = '<p class="thinking">Cargando la partida…</p>';
  await iniciar();
}
async function listarPersonajes(){
  try { const s = await DB.collection("personajes").get(); return s.docs.map(d => ({id:d.id, ...d.data()})); }
  catch(_){ return []; }
}
