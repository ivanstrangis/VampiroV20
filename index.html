<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VampiroV20</title>
<!--web:inicio-->
<meta name="description" content="Hoja de personaje de Vampiro: La Mascarada V20 y Narrador con IA.">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="VampiroV20">
<style id="reset">:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>

<style>
/* Layout: app de una columna (cabecera · chat o pestaña · redacción · barra de pestañas), centrada en pantallas anchas.
   Gótico clásico: negro puro, rojo sangre y plata; títulos en letra gótica, narración de libro antiguo. */
:root{
  --bg:#09090a; --panel:#131315; --panel-2:#1c1c20; --line:#2d2d33;
  --fg:#e8e8ec; --muted:#9b9ba6; --blood:#c1121f; --blood-soft:#360a0e;
  --gold:#c9ccd3; --gold-soft:#24252a; --plata:#d9dbe1; --borde:#6b6b75; --ok:#9fc3a8; --bad:#ff6b77; --ink:#09090a; --extra:#e3a33b;
  --gothic:"UnifrakturMaguntia","Old English Text MT",Georgia,serif;
  --display:"Cinzel","Trajan Pro",Georgia,serif;
  --body:"EB Garamond",Garamond,Georgia,serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:18px;line-height:1.5;display:flex;flex-direction:column}
.gut{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{flex:1;min-height:0;width:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column;border-inline:1px solid var(--line);position:relative}
@media (max-width:460px){.app{border-inline:0}}

.hdr{padding-block:10px 9px;border-bottom:1px solid var(--line);background:var(--bg)}
.who{display:flex;align-items:center;justify-content:space-between;gap:8px}
.who h1{font-family:var(--gothic);font-weight:400;font-size:27px;margin:0;line-height:1.1;text-wrap:balance;min-width:0}
.iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.meters{display:flex;gap:12px;margin-top:6px;flex-wrap:wrap;font-size:16px;color:var(--muted);align-items:center}
.meter{display:flex;align-items:center;gap:5px;border-radius:6px;padding:1px 2px}
.pips{display:flex;gap:2px}
.pip{width:6px;height:10px;border:1px solid var(--line);border-radius:1px}
.pip.on{background:var(--blood);border-color:var(--blood)}
.pip.fv.on{background:var(--gold);border-color:var(--gold)}
.num{font-family:var(--mono);color:var(--fg);font-variant-numeric:tabular-nums}
.scene{font-size:16px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flash{animation:flash 1.2s ease}
@keyframes flash{0%{background:var(--blood-soft)}100%{background:transparent}}

.screen{flex:1;min-height:0;overflow-y:auto;padding-block:16px 100px}
.chat{display:flex;flex-direction:column;gap:14px}
.narr{max-width:94%}
.narr .lbl,.sec-lbl{font-family:var(--display);font-size:16px;letter-spacing:.14em;text-transform:uppercase;color:var(--blood);margin-bottom:3px}
.narr .txt p{margin:0 0 .7em;font-size:20px;line-height:1.6}
.narr .txt p:last-child{margin-bottom:0}
.narr em,.narr q{font-style:italic}
.me{align-self:flex-end;max-width:85%;background:var(--panel-2);border:1px solid var(--line);border-radius:14px 14px 4px 14px;padding:8px 12px;white-space:pre-wrap}
.sys{align-self:center;max-width:96%;text-align:center;font-family:var(--mono);font-size:16px;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:6px 10px}
.sys.blood{color:#f2b8c2;border-color:var(--blood);border-style:solid;background:var(--blood-soft)}
.sys.rule{color:#f0dcae;border-color:var(--gold);border-style:solid;background:var(--gold-soft)}
.sys.err{color:var(--bad);border-color:var(--bad);border-style:solid}
.thinking{color:var(--muted);font-size:16.5px;font-style:italic}

.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card .cap{display:flex;justify-content:space-between;gap:8px;padding:8px 12px;font-size:16px;color:var(--muted);border-top:1px solid var(--line)}
.card svg{display:block;width:100%;height:auto}
.dice{padding:12px}
.dice h3{margin:0 0 2px;font-size:16px;font-weight:600}
.dice .sub{font-size:16px;color:var(--muted);font-family:var(--mono)}
.droll{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 10px;min-height:44px}
.d10{width:40px;height:44px;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:16.5px;background:var(--panel-2);color:var(--muted);clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%)}
.d10.hit{background:var(--gold);color:var(--ink)}
.d10.one{background:var(--blood);color:#fff}
.d10.auto{background:var(--ok);color:var(--ink)}
.d10.spin{animation:spin .5s linear infinite}
@keyframes spin{50%{transform:rotate(18deg) scale(.92)}}
@media (prefers-reduced-motion:reduce){.d10.spin,.flash{animation:none}}
.res{font-weight:600;font-size:16.5px}
.res.good{color:var(--gold)}.res.bad{color:var(--bad)}
.dice-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:6px;font-size:16.5px;color:var(--muted)}
.btn{border:1px solid var(--plata);background:var(--plata);color:var(--ink);border-radius:10px;padding:9px 14px;font-weight:600;font-family:var(--display);font-size:16px;letter-spacing:.04em}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--borde)}
.btn.sangre{background:var(--blood);border-color:var(--blood);color:#fff}
.btn.danger{border-color:var(--blood);background:transparent;color:#f2b8c2}
.btn:disabled{opacity:.4;cursor:not-allowed}
.npc{display:flex;gap:12px;padding:12px;align-items:center}
.npc .mono{width:56px;height:56px;flex:none;border-radius:12px;background:var(--panel-2);display:grid;place-items:center;font-family:var(--gothic);font-size:34px;color:var(--blood)}
.npc b{font-family:var(--display);font-size:17px;font-weight:600;display:block;line-height:1.1}
.npc small{color:var(--muted);font-size:16px;display:block}
.place{padding:14px 12px}
.place b{font-family:var(--display);font-size:19px;font-weight:600;display:block;line-height:1.1}
.place small{color:var(--gold);font-size:16px;letter-spacing:.12em;text-transform:uppercase}
.place p{margin:6px 0 0;color:var(--muted);font-size:16.5px}
.seal{font-family:var(--mono);font-size:16px;color:var(--muted);padding:8px 12px}

.composer{border-top:1px solid var(--line);background:var(--bg);padding-block:8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.chips:empty{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:16.5px;max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip:hover{border-color:var(--gold)}
.chip[aria-pressed="true"]{border-color:var(--blood);background:var(--blood-soft)}
.chip.propio{border-style:dashed}
#j-atajo-mas{font-family:var(--mono);font-weight:700;min-width:44px}
.inrow{display:flex;gap:8px;align-items:flex-end}
.inrow textarea{flex:1;min-width:0;min-height:42px;max-height:120px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--fg);font:inherit;resize:none}

.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--panel);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{border:0;background:none;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:16px;color:var(--muted)}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-selected="true"]{color:var(--fg)}
.tabs button[aria-selected="true"] svg{color:var(--blood)}

.blk{margin-bottom:22px}
.blk h2{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.06em;margin:0 0 8px}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:520px){.cols{grid-template-columns:1fr;gap:4px}.col h3{margin-top:8px}}
.col h3{font-family:var(--display);font-size:16px;letter-spacing:.12em;text-transform:uppercase;color:var(--blood);margin:0 0 4px;font-weight:600}
.trait{display:flex;justify-content:space-between;align-items:center;gap:4px;font-size:16.5px;padding:3px 0;border-bottom:1px solid var(--line)}
.dots{font-size:16px;letter-spacing:1px;color:var(--blood);white-space:nowrap}
.dots i{font-style:normal;color:var(--line)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:16px}
.kv span:last-child{color:var(--muted);text-align:right}
.track{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0 2px}
.track .pip{width:16px;height:16px;border-radius:3px}
/* Salud: un cuadrado por nivel; / contundente, X letal, ✱ agravado (dibujados como trazos de lápiz) */
.hbox{display:block;flex:none}
.hbox rect{fill:none;stroke:var(--muted);stroke-width:1.4}
.hbox path{fill:none;stroke:var(--blood);stroke-width:2.4;stroke-linecap:round}
.hmini{display:flex;gap:2px}
.hstate{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--blood);border-radius:10px;padding:10px 12px;margin-bottom:12px}
.hstate .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.hstate b{font-family:var(--display);font-size:18px;font-weight:600}
.hstate p{margin:4px 0 0;font-size:16.5px;color:var(--muted)}
.penpill{font-family:var(--mono);font-size:16.5px;border:1px solid var(--blood);color:#f2b8c2;background:var(--blood-soft);border-radius:999px;padding:1px 9px;white-space:nowrap}
.penpill.cero{border-color:var(--line);color:var(--muted);background:transparent}
.hfila{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin:0 0 8px}
.hcol{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;border-radius:8px;font-size:16px}
.hcol .num{font-family:var(--mono);color:var(--muted)}
.hcol.actual{background:var(--blood-soft);outline:1px solid var(--blood)}
.hcol.actual .num{color:var(--fg);font-weight:700}
.hdet{margin-top:4px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.hdet summary{padding:10px 14px;font-size:16px;color:var(--muted)}
.hrow{display:grid;grid-template-columns:24px minmax(0,1fr) 34px;gap:2px 10px;align-items:center;padding:6px 6px;border-bottom:1px solid var(--line);font-size:16px}
.hrow .pen{text-align:right}
.hrow small{grid-column:2 / 4;color:var(--muted);font-size:16px;line-height:1.3}
.hrow.actual{background:var(--blood-soft);border-radius:8px;border-bottom-color:transparent}
.hrow.actual span:first-of-type{font-weight:600}
.hleg{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:16px;color:var(--muted)}
.hleg span{display:flex;align-items:center;gap:5px}
.pen{color:var(--muted);font-family:var(--body);font-size:16px;line-height:1.4}
.hrow .pen,.kv .pen{font-family:var(--mono)}
.disc{padding:8px 0;border-bottom:1px solid var(--line)}
.disc p{margin:2px 0 0;font-size:16.5px;color:var(--muted)}
.item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.item .ic{width:58px;height:34px;flex:none;border-radius:8px;background:var(--panel-2);display:grid;place-items:center;color:var(--gold);font-family:var(--mono);font-size:16px}
.item b{font-weight:600}.item p{margin:1px 0 0;font-size:16.5px;color:var(--muted)}
.ammo{display:flex;gap:2px;margin-top:5px;flex-wrap:wrap}
.ammo i{width:4px;height:12px;border-radius:1px;background:var(--gold)}
.ammo i.e{background:var(--line)}
.mag{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:16.5px;color:var(--muted)}
.mag .ammo{margin-top:0;flex:1;min-width:0}
.mlbl{min-width:96px;flex:none;font-family:var(--display);font-size:16px;letter-spacing:.1em;text-transform:uppercase}
.chamber{width:9px;height:14px;border:1px solid var(--gold);border-radius:2px;flex:none}
.chamber.on{background:var(--gold)}
.money{display:flex;justify-content:space-between;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:18px}
.money .num{font-size:19px}
.refugio{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tag{display:inline-block;font-size:16px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted);margin-left:4px}
textarea.notes{width:100%;min-height:120px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--fg);font:inherit;resize:vertical}
.saved{font-size:16px;color:var(--muted);min-height:1.2em;margin-top:4px}

.sheet-bg{position:absolute;inset:0;background:rgba(10,6,12,.6);display:flex;align-items:flex-end;z-index:20}
.sheet{width:100%;background:var(--panel);border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding-block:16px calc(16px + env(safe-area-inset-bottom,0px));max-height:85%;overflow-y:auto}
.sheet h2{font-family:var(--gothic);font-weight:400;font-size:28px;margin:0 0 10px}
.menu-item{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:8px}
.menu-item b{display:block;font-weight:600}
.menu-item small{color:var(--muted);font-size:16px}
.sheet textarea{width:100%;min-height:110px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--fg);font:inherit;resize:vertical;margin-bottom:10px}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.welcome{text-align:center;padding:30px 8px}
.welcome h2{font-family:var(--gothic);font-size:38px;font-weight:400;margin:0 0 6px}
.welcome p{color:var(--muted);margin:0 0 18px}

/* creación */
.steps{display:flex;gap:4px;margin-bottom:14px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--gold)}
.wz h2{font-family:var(--gothic);font-size:30px;font-weight:400;margin:0 0 4px}
.wz .hint{color:var(--muted);font-size:16.5px;margin:0 0 14px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:16px;color:var(--muted);letter-spacing:.04em}
.field input,.field select{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--fg);font:inherit}
.clans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.clan{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
.clan b{font-family:var(--display);font-size:16px;font-weight:600;display:block}
.clan small{color:var(--muted);font-size:16px;line-height:1.35;display:block}
.clan[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft)}
.clan-detail{margin-top:10px;font-size:16.5px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.cat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.cat-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.cat-h b{font-size:16px}
.cat-h select{background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--fg);font:inherit;font-size:16.5px;padding:3px 6px}
.budget{font-family:var(--mono);font-size:16px;color:var(--muted)}
.budget.ok{color:var(--ok)}.budget.over{color:var(--bad)}
.arow{display:flex;justify-content:space-between;align-items:center;padding:4px 0}
.dotpick{display:flex;gap:6px}
.dotpick button{width:22px;height:22px;border-radius:50%;border:1px solid var(--gold);background:transparent;padding:0}
.dotpick button.on{background:var(--gold)}
.dotpick button:disabled{cursor:default;opacity:1}
.dots{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:6px}
.dots button{width:26px;height:26px;border-radius:50%;border:1px solid var(--borde);background:transparent;padding:0}
.dots button.on{background:var(--gold);border-color:var(--gold)}
.dots button.fr{background:var(--extra);border-color:var(--extra)}
.dots button:disabled{cursor:default;opacity:1}
.arow2 .tot small.gr{color:var(--extra);font-size:16px;font-weight:600}
.stat-v.sobra{color:var(--bad)}.stat-v.listo{color:var(--ok)}
.err{color:var(--bad);font-size:16.5px;min-height:1.3em;margin:4px 0 0}
.wz-nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.later{list-style:none;padding:0;margin:0}
.later li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:16px}
.later li span{color:var(--muted);font-family:var(--mono);font-size:16px;text-align:right}
.field textarea{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--fg);font:inherit;min-height:84px;resize:vertical}
details.cat summary{cursor:pointer;font-weight:600;font-size:16px;padding:2px 0}
details.cat[open] summary{margin-bottom:6px}
.fb{display:flex;align-items:center;gap:8px}
.fb button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--bg);padding:0;font-family:var(--mono)}
.fb button:disabled{opacity:.35;cursor:default}
.fb b{min-width:18px;text-align:center;font-family:var(--mono);font-weight:700}
.fb small{color:var(--gold);font-family:var(--mono);font-size:16px;min-width:24px;text-align:right}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px;margin:6px 0 4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 10px;text-align:left}
.seg button b{display:block;font-weight:600}.seg button small{color:var(--muted);font-size:16px}
.seg button[aria-checked="true"]{background:var(--gold-soft);outline:1px solid var(--plata)}
.tool{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tool .chk{margin:4px 0}
.jrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.jstat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.jstat>div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.jstat b{font-size:22px}.jstat small{color:var(--muted);font-size:16px}
.toast{position:absolute;left:16px;right:16px;bottom:84px;z-index:30;text-align:center;font-family:var(--body);font-size:16px}
.nota{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:6px;font:inherit;color:inherit;white-space:pre-wrap}
.nota:hover{border-color:var(--gold)}.nota small{display:block;color:var(--blood);font-family:var(--display);font-size:16px;letter-spacing:.1em;text-transform:uppercase}
.fab{position:absolute;right:max(16px, env(safe-area-inset-right, 0px));bottom:76px;z-index:15;width:52px;height:52px;border-radius:50%;border:1px solid var(--blood);background:var(--panel-2);color:var(--fg);display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.45);padding:0}
.fab svg{width:32px;height:32px}
.fab:active{transform:scale(.95)}
.d10.dr{border:0;cursor:pointer;font:inherit;font-family:var(--mono);font-weight:700;font-size:16.5px}
.d10.dr.uno{background:var(--blood);color:#fff}
.d10.dr.cero{background:#3f8f57;color:#fff}
.d10.dr.gris{background:var(--line);color:var(--muted);opacity:.7}
.drw{display:grid;place-items:center;width:48px;height:52px;clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%)}
.drw.extra{background:#4fbf72}
.drw.anulado{background:var(--blood)}
.drw.anulado > .d10:not(.dr){background:var(--line);color:var(--muted);opacity:.75}
.dr-der{display:flex;align-items:center;gap:8px}
.drauto{width:40px;height:40px;border-radius:50%;background:transparent;font-family:var(--display);font-weight:700;font-size:17px;padding:0;display:grid;place-items:center}
.drauto.uno{border:1.5px solid var(--blood);color:var(--blood)}
.drauto.cero{border:1.5px solid #3f8f57;color:#3f8f57}
.drauto:disabled{opacity:.3;cursor:default}
.trait.tras{flex-wrap:wrap}.trait.tras small{flex-basis:100%;color:var(--muted);font-size:16px;line-height:1.35;padding:2px 0 4px}
.tras-det{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--fg);font:inherit;font-size:16px;padding:6px 10px;margin:2px 0 8px}
.recurso{display:flex;flex-direction:column;gap:10px;padding:10px 0 14px;border-bottom:1px solid var(--line);margin-bottom:12px}
.rec-h{display:flex;justify-content:space-between;align-items:baseline}
.rec-h label{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.04em}
.rec-n{justify-content:center}
.rec-n input{width:80px;text-align:center;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--fg);font:inherit;font-family:var(--mono);font-size:19px;padding:6px}
.rec-n button{width:44px;height:44px;font-size:20px}
.rec-btn{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rec-btn .btn{padding:12px 10px}
.barra3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.barra3 .btn{padding:8px 4px;font-size:16px;white-space:nowrap}
.arma{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.arma:first-of-type{border-top:0;margin-top:0;padding-top:0}
.rep-n{width:70px;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--fg);font:inherit;font-family:var(--mono);padding:4px 6px}
.b4 .btn{white-space:normal;line-height:1.2}
.mydsel{background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--fg);font:inherit;font-size:16px;padding:4px 6px}
.arow2{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 10px;padding:8px 0;border-bottom:1px solid var(--line)}
.arow2:last-child{border-bottom:0}
.arow2 .tot{font-family:var(--mono);font-weight:700;font-size:18px;min-width:22px;text-align:right}
.arow2 .fb small{min-width:28px;text-align:center}
.sub-h{display:flex;justify-content:space-between;align-items:center;margin:10px 0 2px;color:var(--muted);font-size:16px}
.leyenda{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:16px;margin:4px 0 10px}
.leyenda i{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--gold);vertical-align:-2px;margin-right:6px}
.leyenda i.fr{background:var(--extra)}
.leyenda em{font-style:normal;font-family:var(--mono);color:var(--gold);margin-right:6px}
.myd-det{margin:0 0 8px}
.myd-det label{display:block;color:var(--muted);font-size:16px;margin-bottom:2px}
.niveles li:has(> .pdet){display:block}
.pdet summary{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;align-items:baseline;cursor:pointer;list-style:none}
.pdet summary::-webkit-details-marker{display:none}
.pdet .pn,.pnom{text-decoration:underline dotted;text-underline-offset:3px;color:var(--fg);font-weight:500}
.pnom{background:none;border:0;padding:0;font:inherit;cursor:pointer}
.pod{margin:2px 0 0}
.arqbox .pdesc{margin-top:0}
.pdesc{margin:2px 0 8px;padding:8px 10px;border-left:2px solid var(--blood);background:var(--panel-2);border-radius:0 8px 8px 0;color:var(--fg);font-size:16px;line-height:1.45}
.pdet p{margin:6px 0 4px 72px;color:var(--fg);font-size:16px;line-height:1.45}
.disf .fila{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.disf .fila b{font-family:var(--display);font-weight:600}
.disf .estado{font-size:16px;color:var(--muted)}
.disf .estado.on{color:var(--fg)}
.fb input[type=checkbox]{width:20px;height:20px;accent-color:var(--blood)}
.menu-item.actual{border-color:var(--gold);background:var(--gold-soft)}
.pjlist{margin-top:6px}
.info{background:none;border:0;padding:0;text-align:left;font:inherit;color:inherit;text-decoration:underline dotted var(--muted);text-decoration-thickness:1px;text-underline-offset:4px;cursor:help}
.info:hover{text-decoration-color:var(--gold)}
.info-desc{margin:0 0 12px;font-size:17px;line-height:1.5}
.niveles{list-style:none;padding:0;margin:0 0 14px;display:flex;flex-direction:column;gap:4px}
.niveles li{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;align-items:baseline;padding:7px 8px;border-radius:8px;font-size:16.5px}
.niveles li.actual{background:var(--blood-soft);outline:1px solid var(--blood)}
.banner{font-size:16px;color:var(--muted);background:var(--panel);border-bottom:1px solid var(--line);padding-block:6px;text-align:center}

/* ---------- rediseño: cabecera ---------- */
.hdr{padding-block:12px 10px;display:flex;flex-direction:column;gap:8px}
.hstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.stat{position:relative;overflow:hidden;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:6px 10px 8px;text-align:left;display:flex;flex-direction:column;gap:0;min-width:0}
.stat-l{font-size:16px;color:var(--muted);line-height:1.2}
.stat-v{font-size:20px;font-weight:700;line-height:1.25}.stat-v small{font-size:16px;color:var(--muted);font-weight:500}
.stat.sangre{border-color:#5a1a20;background:#170a0c}.stat.sangre .stat-l{color:#f2b8c2}
.stat-bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:#24242a}.stat-bar i{display:block;height:100%;width:0;background:var(--blood);transition:width .3s}
.stat-bar.plata i{background:var(--plata)}
.hsalud{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 10px;display:flex;align-items:center;gap:10px;text-align:left;font-size:16px;min-width:0}
.hsalud .hmini{gap:3px}.hsalud .pen{font-size:16px}
.stat:active,.hsalud:active{transform:scale(.98)}
.scene{font-size:16px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ---------- rediseño: Juego ---------- */
.jblk{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.jlbl{font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
.chips.wrap{flex-wrap:wrap;overflow:visible;padding-bottom:0;gap:6px}
.chip{padding:6px 12px;font-size:16px}
.chip.mas{font-family:var(--mono);font-weight:700;min-width:46px;text-align:center}
.chip[aria-pressed="true"]{border-color:var(--plata);background:var(--gold-soft)}
.chip.propio{border-style:dashed;border-color:var(--borde)}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:14px}
.t-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.t-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.t-tit{font-family:var(--display);font-weight:600;font-size:19px;line-height:1.2}
.t-sub{font-size:16px;color:var(--muted);line-height:1.35}
.t-n{font-size:32px;font-weight:700;line-height:1;white-space:nowrap}.t-n small{font-size:16px;color:var(--muted);font-weight:500}
.t-ctl{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.dif{display:flex;align-items:center;gap:10px}
.stepper{display:flex;align-items:center;justify-content:center;gap:14px}
.stepper button{width:56px;height:56px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:26px;line-height:1;display:grid;place-items:center;padding:0}
.stepper button:disabled{opacity:.35;cursor:default}
.stepper b{font-size:34px;min-width:52px;text-align:center}
.stepper.chico{gap:8px}.stepper.chico button{width:44px;height:44px;font-size:22px;border-radius:10px}.stepper.chico b{font-size:20px;min-width:34px}
.tog{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 14px;font-size:16px;white-space:nowrap}
.tog[aria-pressed="true"]{border-color:var(--plata);background:var(--gold-soft);font-weight:600}
.tog:disabled{opacity:.35}
.btn.grande{height:52px;font-size:18px;border-radius:12px}
#j-out:empty,.jout:empty{display:none}
#j-out .droll,.jout .droll{margin:2px 0 6px}
.armas{gap:0;padding-block:4px}
.arma{display:flex;flex-direction:column;gap:12px;padding:14px 0;border-top:1px solid var(--line);margin:0}
.arma:first-child{border-top:0}
.a-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.a-txt{display:flex;flex-direction:column;gap:4px;min-width:0}
.a-sub{display:flex;align-items:center;gap:8px;font-size:16px;color:var(--muted);flex-wrap:wrap}.a-sub .ammo{margin:0;flex:none}
.a-info{font-size:16px;color:var(--muted);text-align:right;line-height:1.35;white-space:nowrap}
.a-ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select.mini{height:44px;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--fg);font:inherit;font-size:16px;padding:0 10px;min-width:0;flex:1 1 140px}
.par{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.par .btn{height:50px}
.folds{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel)}
.fold+.fold{border-top:1px solid var(--line)}
.fold summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:14px;font-size:17px}
.fold summary::-webkit-details-marker{display:none}
.fold summary::after{content:"›";color:var(--muted);font-size:22px;transition:transform .2s}
.fold[open] summary::after{transform:rotate(90deg)}
.fold-in{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
/* ---------- rediseño: paneles ---------- */
.asa{width:40px;height:4px;border-radius:2px;background:#3a3a42;margin:0 auto 12px}
#rs-body,#hs-body{display:flex;flex-direction:column;gap:16px}
.sh-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sheet .sh-top h2{font-family:var(--display);font-weight:600;font-size:22px;margin:0}
.sh-val{font-size:24px;font-weight:700}.sh-val small{font-size:16px;color:var(--muted);font-weight:500}
.sheet p.pen{margin:0}
.sh-sec{display:flex;flex-direction:column;gap:8px}
.sh-fila{display:flex;justify-content:space-between;align-items:center;gap:12px}
.barra{display:flex;gap:2px}.barra i{flex:1;height:14px;border-radius:2px;background:var(--line)}.barra i.on{background:var(--blood)}
.barra.plata i.on{background:var(--plata)}
.cajas7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cajas7>div{display:flex;flex-direction:column;align-items:center;gap:4px}.cajas7 .num{font-size:16px;color:var(--muted)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.seg3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg3 button{height:44px;border:0;border-radius:9px;background:transparent;font-size:16px;white-space:nowrap}
.seg3 button[aria-checked="true"]{background:var(--gold-soft);outline:1px solid var(--plata)}
/* ---------- etiquetas en plata: el rojo queda para Sangre y daño ---------- */
.sec-lbl,.col h3{color:#b9bcc6}

/* =====================================================================
   Capa armoniosa: tarjetas sin bordes, píldoras, títulos simples, dos tipografías.
   ===================================================================== */
:root{--bg:#0e0e10;--panel:#18181b;--panel-2:#212126;--line:#26262b;--fg:#ececef;--muted:#a3a3ad;--plata:#e6e6ea;--ink:#0e0e10;--gold-soft:#24242a;
  --borde:#3a3a42;--sombra:none;--rad:20px;--mono:"Cinzel","Trajan Pro",Georgia,serif;--sangre-txt:#f4b7bf}
body{font-size:17px}
.num{font-family:var(--display);font-weight:600}
/* cabecera compacta */
.hdr{border-bottom:0;padding-block:14px 6px;gap:10px}
.who h1{font-size:25px}
.iconbtn{width:44px;height:44px;border-radius:50%;border:0;background:var(--panel);box-shadow:var(--sombra)}
.hres{background:var(--panel);border-radius:var(--rad);box-shadow:var(--sombra);padding:10px 14px 8px;display:flex;flex-direction:column;gap:6px}
.hstats{grid-template-columns:1.25fr 1fr 1fr;gap:10px}
.stat{border:0;background:transparent;padding:0 0 8px;border-radius:0}
.stat.sangre{border:0;background:transparent}
.stat-l{font-size:15px}
.stat.sangre .stat-l{color:var(--sangre-txt)}
.stat-v{font-family:var(--display);font-size:22px;font-weight:600}
.stat.sangre .stat-v{font-size:26px}
.stat-bar{height:3px;border-radius:2px;background:var(--panel-2);right:auto;width:100%}
.hsalud{border:0;border-top:1px solid var(--line);border-radius:0;background:transparent;padding:8px 0 2px;justify-content:space-between;gap:10px}
.hsalud .hmini{gap:4px;flex-wrap:wrap}
#n-salud{color:var(--muted);text-align:right}
.scene{padding:0 4px}
/* barra de pestañas flotante */
.tabs{margin:0 16px 12px;border-top:0;background:var(--panel);border-radius:28px;padding:6px;gap:4px;box-shadow:0 8px 28px rgba(0,0,0,.28)}
.tabs button{border-radius:22px;padding:7px 0 6px;font-size:15px}
.tabs button[aria-selected="true"]{background:var(--panel-2);font-weight:600}
.tabs button[aria-selected="true"] svg{color:var(--fg)}
.screen{padding-block:12px 96px}
.composer{border-top:0;background:transparent}
.fab{bottom:94px;border:0;background:var(--panel);color:var(--blood);box-shadow:0 6px 18px rgba(0,0,0,.3)}
/* botones y controles en píldora */
.btn{border-radius:999px;padding:10px 18px;letter-spacing:.02em}
.btn.grande{height:54px;border-radius:999px}
.btn.ghost{border-color:var(--line)}
.par .btn,.rec-btn .btn,.barra3 .btn{border-radius:999px}
.chip{border:0;background:var(--panel);box-shadow:var(--sombra);padding:8px 16px;height:40px}
.chip[aria-pressed="true"]{background:var(--plata);color:var(--ink);border:0}
.chip.propio{border:1px dashed var(--borde)}
.tog{border-radius:999px;border-color:var(--line);background:transparent}
.tog[aria-pressed="true"]{background:var(--plata);color:var(--ink);border-color:var(--plata)}
.stepper.chico{background:var(--panel-2);border-radius:999px;padding:3px;gap:2px}
.stepper.chico button{border:0;background:transparent;border-radius:50%;width:42px;height:42px}
.stepper.chico b{min-width:40px}
.stepper button{border-radius:50%;border:0;background:var(--panel-2)}
select.mini,.field input,.field select,.field textarea,.mydsel,.cat-h select,.rep-n,.tras-det,.inrow textarea,textarea.notes,.sheet textarea{border-color:var(--line);border-radius:14px;background:var(--panel-2)}
.seg,.seg3{background:var(--panel-2);border:0;border-radius:24px;padding:4px}
.seg button,.seg3 button{border-radius:20px}
.seg button[aria-checked="true"],.seg3 button[aria-checked="true"]{background:var(--panel);outline:0;box-shadow:var(--sombra),0 0 0 1px var(--line)}
.seg button[disabled]{opacity:.45}
/* tarjetas */
.tcard,.card,.cat,.money,.refugio,.tool,.hstate,.clan,.clan-detail,.nota,.folds,.hdet,.jstat>div{border:0;border-radius:var(--rad);background:var(--panel);box-shadow:var(--sombra)}
.tcard{padding:18px;gap:16px}
.hstate{border-left:0;padding:12px 16px}
.folds{overflow:hidden}
.hdet{margin-top:10px}
.clan[aria-pressed="true"]{background:var(--panel-2);box-shadow:0 0 0 1.5px var(--plata)}
.menu-item{border:0;background:var(--panel);border-radius:16px;box-shadow:var(--sombra);padding:13px 16px}
.menu-item.actual{background:var(--panel);box-shadow:0 0 0 1.5px var(--plata)}
.sheet{background:var(--bg);border-top:0;border-radius:26px 26px 0 0}
.sheet h2{font-family:var(--display);font-weight:600;font-size:24px}
.sheet-bg{background:rgba(5,5,7,.6)}
/* títulos simples, sin mayúsculas espaciadas */
.jlbl,.blk h2{font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:0;text-transform:none;color:var(--fg);margin:0 0 10px}
.jblk{gap:14px;margin-bottom:26px}
.jblk>.jlbl{margin:0}
.chips.wrap{gap:10px 8px}
.sec-lbl,.col h3,.mlbl,.nota small,.place small,.narr .lbl{font-family:var(--body);font-size:16px;letter-spacing:0;text-transform:none;color:var(--muted);font-weight:500}
.narr .lbl{color:var(--sangre-txt)}
/* Ficha: cada sección en su tarjeta; solapas */
.blk{background:var(--panel);border-radius:var(--rad);box-shadow:var(--sombra);padding:14px 16px;margin-bottom:14px}
.blk .kv:last-child,.blk .trait:last-child{border-bottom:0}
.ftabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:24px;background:var(--panel-2);margin-bottom:14px}
.ftabs button{height:40px;border:0;border-radius:20px;background:transparent;color:var(--muted);font-size:16px}
.ftabs button[aria-selected="true"]{background:var(--panel);color:var(--fg);font-weight:600;box-shadow:var(--sombra),0 0 0 1px var(--line)}
.barra3{margin-bottom:14px}
.kv,.trait,.arow2,.hrow,.later li,.item,.disc,.arma{border-color:var(--line)}
.col h3{margin-top:6px}
/* tirada: la cantidad de dados como dato, no como cartel */
.t-n{font-family:var(--body);font-size:16px;font-weight:600;line-height:1;background:var(--panel-2);border-radius:999px;padding:8px 12px;white-space:nowrap}
.t-n small{font-size:16px;color:var(--fg);font-weight:600}
.t-tit{font-size:20px}
/* dados */
.d10{font-family:var(--display);font-weight:700}
.undo{bottom:96px}
.tras-base{margin:6px 0 2px;color:var(--muted);font-size:16px;line-height:1.4}
.tras-nota{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:16px;line-height:1.4}
.tras-nota:first-of-type{margin-top:6px}
.tn-x{border:0;background:transparent;color:var(--muted);font-size:20px;line-height:1;width:32px;height:32px;border-radius:50%;flex:none}
.tras-add{display:flex;gap:8px;align-items:center;margin-top:8px}
.tras-add .tras-det{margin:0;flex:1;min-width:0;height:42px}
.tras-add .btn{flex:none;padding:8px 14px}
.esp-fila{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:10px;align-items:center;padding:4px 0}
.esp-fila .tras-det{margin:0;height:40px}
.tog.esp[aria-pressed="true"]{background:#2e6b41;border-color:#2e6b41;color:#fff}
.blk.sinfondo{background:transparent;box-shadow:none;padding:0;margin-bottom:12px}
.blk.sinfondo .barra3{margin:0}
.blk .hstate,.blk .hdet{background:var(--panel-2);box-shadow:none}
.hsalud .hmini{flex-wrap:nowrap;flex:none}
#n-salud{font-size:15px;line-height:1.3}
.screen{padding-top:8px}

<body>

<div class="app" id="app">
  <header class="hdr gut">

      <h1 id="pj-nombre">Cargando…</h1>
      <button class="iconbtn" id="btn-menu" type="button" aria-label="Abrir menú"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h14"/></svg></button>

  <main class="screen gut" id="s-chat"><div class="chat" id="chat" aria-live="polite"></div></main>

  </div>

  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" aria-selected="true" data-t="chat" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>Narrador</button>

    <button role="tab" aria-selected="false" data-t="inv" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>Inventario</button>
    <button role="tab" aria-selected="false" data-t="notas" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M5 4h14v16H5z"/><path d="M8 4v16"/></svg>Notas</button>
  </nav>

  <div class="undo" id="undo" role="status" hidden><span id="undo-txt"></span><button type="button" id="undo-btn">Deshacer</button></div>
  <div id="sheet-root"></div>
</div>

<script>
"use strict";
/* Apariencia: oscuro (por defecto) o claro, recordado en este navegador */
let TEMA = "oscuro";
try { TEMA = localStorage.getItem("bbn_tema") || "oscuro"; } catch(_){}
function aplicarTema(t){ TEMA = t; if(t === "claro") document.documentElement.dataset.theme = "light"; else delete document.documentElement.dataset.theme; try { localStorage.setItem("bbn_tema", t); } catch(_){} document.querySelector('meta[name="theme-color"]')?.setAttribute("content", t === "claro" ? "#f3f1ee" : "#0e0e10"); }
aplicarTema(TEMA);
/* =====================================================================
   Datos de reglas (de claude/01-resumen-reglas.md y bbn/reglas.py)
   ===================================================================== */
const GEN = {13:[5,10,1],12:[5,11,1],11:[5,12,1],10:[5,13,1],9:[5,14,2],8:[5,15,3],7:[6,20,4]};
const SALUD = [["Magullado",0],["Lastimado",-1],["Lesionado",-1],["Herido",-2],["Malherido",-2],["Tullido",-5],["Incapacitado",null]];
const ATR = {fisicos:["fuerza","destreza","resistencia"],sociales:["carisma","manipulacion","apariencia"],mentales:["percepcion","inteligencia","astucia"]};
const HAB = {talentos:["alerta","atletismo","consciencia","empatia","expresion","intimidacion","liderazgo","pelea","subterfugio","callejeo"],
  tecnicas:["armas_de_fuego","conducir","etiqueta","interpretacion","pelea_con_armas","artesania","latrocinio","sigilo","supervivencia","trato_con_animales"],
  conocimientos:["academicismo","ciencias","finanzas","informatica","investigacion","leyes","medicina","ocultismo","politica","tecnologia"]};
const HAB_ALL = Object.values(HAB).flat();
const VIRT = ["conciencia","autocontrol","coraje"];
const L = {fuerza:"Fuerza",destreza:"Destreza",resistencia:"Resistencia",carisma:"Carisma",manipulacion:"Manipulación",apariencia:"Apariencia",
  percepcion:"Percepción",inteligencia:"Inteligencia",astucia:"Astucia",alerta:"Alerta",atletismo:"Atletismo",consciencia:"Consciencia",
  empatia:"Empatía",expresion:"Expresión",intimidacion:"Intimidación",liderazgo:"Liderazgo",pelea:"Pelea",subterfugio:"Subterfugio",
  callejeo:"Callejeo",armas_de_fuego:"Armas de Fuego",conducir:"Conducir",etiqueta:"Etiqueta",interpretacion:"Interpretación",
  pelea_con_armas:"Pelea con Armas",artesania:"Artesanía",latrocinio:"Latrocinio",sigilo:"Sigilo",supervivencia:"Supervivencia",
  trato_con_animales:"Trato con Animales",academicismo:"Academicismo",ciencias:"Ciencias",finanzas:"Finanzas",informatica:"Informática",
  investigacion:"Investigación",leyes:"Leyes",medicina:"Medicina",ocultismo:"Ocultismo",politica:"Política",tecnologia:"Tecnología",
  conciencia:"Conciencia",autocontrol:"Autocontrol",coraje:"Coraje",humanidad:"Humanidad",fuerza_de_voluntad:"Fuerza de Voluntad",
  serpentis:"Serpentis",fortaleza:"Fortaleza",celeridad:"Celeridad",potencia:"Potencia",presencia:"Presencia",ofuscacion:"Ofuscación",
  auspex:"Auspex",dominacion:"Dominación",animalismo:"Animalismo",protean:"Protean",generacion:"Generación",mentor:"Mentor",
  recursos:"Recursos",contactos:"Contactos",aliados:"Aliados",rebano:"Rebaño",refugio:"Refugio",influencia:"Influencia",
  fama:"Fama",identidad_alternativa:"Identidad Alternativa",criados:"Criados",estatus:"Estatus",dominio:"Dominio",
  extincion:"Extinción",dementacion:"Dementación",necromancia:"Necromancia",obtenebracion:"Obtenebración",quimerismo:"Quimerismo",
  taumaturgia:"Taumaturgia",vicisitud:"Vicisitud",fisicos:"Físicos",sociales:"Sociales",mentales:"Mentales",talentos:"Talentos",
  tecnicas:"Técnicas",conocimientos:"Conocimientos"};
const lab = k => L[k] || (k.charAt(0).toUpperCase()+k.slice(1).replace(/_/g," "));
const norm = s => String(s ?? "").toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g,"").trim().replace(/\s+/g,"_");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = s => document.querySelector(s);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const wait = ms => new Promise(r => setTimeout(r, reduce ? Math.min(ms,120) : ms));

/* =====================================================================
   Estado en memoria (espejo de la base de la página)
   ===================================================================== */
// Personaje activo. Mateo conserva sus rutas originales; los nuevos usan rutas con su id.
let PJ = "";
try { PJ = localStorage.getItem("bbn_pj") || ""; } catch(_){}
const R = {
  ficha: () => "personajes/"+PJ, inv: () => "inventario/"+PJ, con: () => "conocimiento/"+PJ, notas: () => "notas/"+PJ,
  mundo: () => "mundo/"+PJ, guia: () => "director/"+CID(), cron: () => "cronica/"+CID(), meta: () => "cronicas/"+CID(), msgs: () => "mensajes_"+PJ
};
// La crónica (el universo) es independiente del personaje. Los personajes viejos usan su propio id como id de crónica.
const CID = () => MUNDO?.cronica_id || PJ;
const URL_CLAUDE = "https://claude.ai/artifact/1ZNPa2WaZXUM27VeTRzNxF";  // la misma app publicada como artefacto de Claude
let DB = null, SAMPLE = null, TOOLS_MAX = 0;
/* Cada jugador guarda todo en su espacio privado: data/users/<su id>/<colección>__<documento>.
   Nadie más lo ve, ni siquiera el dueño de la página. */
let RAW = null, USER = null, YO = null, DESCARGAS = null;
const real = p => "data/users/" + YO + "/" + p.replace("/", "__");
function snapLimpio(s){ return {exists:s.exists, id:s.id, metadata:s.metadata||{}, data:() => { const d = {...(s.data()||{})}; delete d._c; return d; }}; }
function crearDB(raw){
  const doc = p => { const r = raw.doc(real(p)), c = p.split("/")[0];
    return {get: async () => snapLimpio(await r.get()), set: d => r.set({...d, _c:c}), update: d => r.update(d), delete: () => r.delete(),
      onSnapshot: (fn, err) => r.onSnapshot(s => fn(snapLimpio(s)), err)}; };
  const collection = name => {
    const q = raw.collection("data/users/" + YO).where("_c", "==", name);
    const get = async () => { const s = await q.get(); return {docs: s.docs.map(d => ({id:d.id.split("__").slice(1).join("__"), data:() => { const x = {...d.data()}; delete x._c; return x; }}))}; };
    const yo = {get, orderBy: () => yo, limit: () => yo}; return yo; };
  return {doc, collection};
}
// Narrador IA: solo si la cuenta del jugador lo permite y el personaje se juega con IA (no las hojas de otros jugadores).
const HAY_IA = () => !!SAMPLE;
const esHojaAjena = () => !!F?.hoja_de_jugador;
let F = null;            // ficha
let INV = {items:[]};    // inventario
let CON = {hechos:[]};   // lo que sabe el personaje
let MUNDO = {};          // escena, noche, opciones, sellos, resumen
let GUIA = {texto:"", pnj:[]};   // cuaderno del Director de la crónica activa
let CRON = null;         // datos de la crónica activa: nombre, tipo, idea
let NOTAS = {texto:""};
let MSGS = [];           // mensajes de la partida en orden
let running = null;      // AbortController del Narrador en curso

class ReglaError extends Error {}

/* ---------- escritura ordenada por documento ---------- */
const colas = {}, pend = {};
function escribir(path, data, modo="set"){
  if(!DB) return Promise.resolve();
  const limpio = JSON.parse(JSON.stringify(data));
  pend[path] = (pend[path]||0) + 1;
  colas[path] = (colas[path] || Promise.resolve()).then(() => DB.doc(path)[modo](limpio)).catch(e => {
    console.warn("db", path, e); sysMsg("No se pudo guardar un cambio ("+(e.code||"error")+"). Recargá la página si se repite.","err",false);
  }).finally(() => { pend[path]--; });
  return colas[path];
}
let lastN = 0;
const nextN = () => (lastN = Math.max(Date.now(), lastN + 1));
const guardarFicha = () => escribir(R.ficha(), F);
const guardarInv = () => escribir(R.inv(), INV);
const guardarCon = () => escribir(R.con(), CON);
const guardarMundo = () => escribir(R.mundo(), MUNDO);
function evento(tipo, detalle){
  const n = nextN();
  escribir("eventos/e"+n, {n, tipo, pj:PJ, noche:MUNDO.noche ?? null, detalle});
}

/* =====================================================================
   Motor de reglas (port de bbn/motor.py)
   ===================================================================== */
function d10(){ const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % 10 + 1; }
function hex(bytes){ return [...bytes].map(b => b.toString(16).padStart(2,"0")).join(""); }
async function sha256(t){ return hex(new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)))); }

function tirar(n, dif, {auto=0, unosRestan=true, esp=false}={}){
  if(dif < 2 || dif > 10) throw new ReglaError("La dificultad va de 2 a 10.");
  n = Math.max(0, Math.floor(n));
  const dados = Array.from({length:n}, d10).sort((a,b) => b - a);   // de mayor a menor: 10 primero, 1 al final
  const hits = dados.filter(d => d >= dif).length, unos = dados.filter(d => d === 1).length;
  const exitos = hits + (esp ? dados.filter(d => d === 10).length : 0);
  const anulados = unosRestan ? Math.min(unos, exitos) : 0;
  const neto = exitos - anulados + auto;
  const resultado = (unosRestan && hits === 0 && unos > 0 && auto === 0) ? "fracaso" : (neto <= 0 ? "fallo" : "exito");
  return {dados, dificultad:dif, exitos, unos, automaticos:auto, neto:Math.max(neto,0), resultado, especialidad:!!esp};
}
const textoTirada = t => t.resultado === "fracaso" ? "Fracaso total" : t.resultado === "fallo" ? "Fallo" : `${t.neto} éxito${t.neto>1?"s":""}`;

const limites = () => GEN[F.generacion] || GEN[13];
// Niveles de Salud del personaje: los 7 del manual más los Magullados extra (Corpulento, o salud_extra que fije el Narrador).
function extraSalud(){ return (F?.salud_extra || 0) + ((F?.meritos || []).some(m => /^corpulento/.test(m.id || norm(m.nombre || ""))) ? 1 : 0); }
function SALUDV(){ return [...Array(extraSalud()).fill(["Magullado",0]), ...SALUD]; }
function EFECTOV(){ return [...Array(extraSalud()).fill("Sin penalización."), ...EFECTO_SALUD]; }
function penalizacion(){ const n = F.salud.length; return n === 0 ? 0 : SALUDV()[Math.min(n, SALUDV().length)-1][1]; }
function nivelSalud(){ const n = F.salud.length; return n === 0 ? "Sin daño" : SALUDV()[Math.min(n, SALUDV().length)-1][0]; }
/* Implicancias de cada nivel de salud (resumen V20 [282-286]) */
const EFECTO_SALUD = ["Sin penalización.", "−1 dado. Se mueve con normalidad.", "−1 dado. Corre a la mitad de su velocidad.",
  "−2 dados. No puede correr; si se mueve y ataca en el mismo turno, pierde dados.", "−2 dados. Solo puede cojear (3 m por turno).", "−5 dados. Solo puede arrastrarse (1 m por turno).",
  "No puede moverse ni actuar, salvo curarse con Sangre o beber. Más daño contundente o letal: Letargo. Agravado: Muerte Definitiva. Sin Sangre: Letargo."];
const TIPO_DANO = {C:"contundente", L:"letal", A:"agravado"};
const fmtPen = p => p === null ? "—" : p === 0 ? "0" : "−"+Math.abs(p);
const penDados = p => fmtPen(p) + (Math.abs(p) === 1 ? " dado" : " dados");
// Un cuadrado de salud dibujado: vacío, / contundente, X letal, ✱ agravado.
function cajaSalud(t, size=22){
  const m = {C:"M4 16L16 4", L:"M4 16L16 4M4 4L16 16", A:"M4 16L16 4M4 4L16 16M10 2.5V17.5M2.5 10H17.5"}[t] || "";
  return `<svg class="hbox" width="${size}" height="${size}" viewBox="0 0 20 20" role="img" aria-label="${t ? "daño "+TIPO_DANO[t] : "sin daño"}"><rect x="1" y="1" width="18" height="18" rx="2"/>${m?`<path d="${m}"/>`:""}</svg>`;
}
function estadoSaludHTML(){
  const n = F.salud.length, pen = penalizacion();
  const efecto = n === 0 ? "Sin heridas. Puede actuar con normalidad." : EFECTOV()[Math.min(n, SALUDV().length)-1];
  const extra = F.estado && F.estado !== "activo" ? `<p style="color:var(--bad)">Estado: ${esc(F.estado.replace(/_/g," "))}</p>` : "";
  const tipos = ["A","L","C"].map(t => [t, F.salud.filter(x => x === t).length]).filter(([,k]) => k).map(([t,k]) => `${k} ${TIPO_DANO[t]}`).join(" · ");
  return `<div class="hstate"><div class="top"><b>${nivelSalud()}</b><span class="penpill ${pen ? "" : "cero"}">${pen === null ? "no actúa" : penDados(pen)}</span></div>
    <p>${efecto}${tipos ? " Daño: "+tipos+"." : ""}</p>${extra}</div>`;
}
function activo(){ if((F.estado||"activo") !== "activo") throw new ReglaError(`${F.nombre} está en ${String(F.estado).replace(/_/g," ")} y no puede actuar.`); }
function tieneDefecto(id){ return (F.defectos||[]).some(d => d.id === id); }
function hambriento(){ return F.sangre <= ((F.criterios||{}).umbral_hambre ?? 7); }

function rasgo(nombre){
  const n = norm(nombre);
  for(const g of ["atributos","habilidades","disciplinas","virtudes","trasfondos"]) if(F[g] && n in F[g]) return F[g][n];
  if(HAB_ALL.includes(n)) return 0;
  if(n === "humanidad") return F.humanidad;
  if(["fuerza_de_voluntad","voluntad","fv"].includes(n)) return F.fv_max;
  throw new ReglaError(`No reconozco el Rasgo «${nombre}».`);
}

function gastarSangre(n, motivo, ignora=false){
  n = Math.floor(Number(n));
  if(!(n >= 1)) throw new ReglaError("Hay que gastar al menos 1 punto de Sangre.");
  const porTurno = limites()[2];
  if(n > F.sangre) throw new ReglaError(`${F.nombre} tiene ${F.sangre} de Sangre; no le alcanza para gastar ${n}.`);
  if(n > porTurno && !ignora) throw new ReglaError(`Por su Generación, ${F.nombre} puede gastar como máximo ${porTurno} de Sangre por turno.`);
  const antes = F.sangre; F.sangre -= n;
  evento("sangre_gastada", {motivo, de:antes, a:F.sangre});
  return {antes, ahora:F.sangre};
}
function gastarFV(motivo){
  if(F.fv < 1) throw new ReglaError(`${F.nombre} no tiene Fuerza de Voluntad para gastar.`);
  const antes = F.fv; F.fv -= 1; evento("fv_gastada", {motivo, de:antes, a:F.fv});
  return {antes, ahora:F.fv};
}
function alimentarse(puntos, presa, adrenalina){
  puntos = Math.floor(Number(puntos)); activo();
  if(!(puntos >= 1)) throw new ReglaError("Hay que beber al menos 1 punto.");
  if(puntos > 3) throw new ReglaError("Se pueden beber como máximo 3 puntos de Sangre por turno.");
  const antes = F.sangre; F.sangre = Math.min(F.sangre + puntos, limites()[1]);
  const avisos = [];
  if(tieneDefecto("adiccion_adrenalina") && !adrenalina) avisos.push("FRENESÍ AUTOMÁTICO: la sangre no tenía adrenalina (Adicción a la adrenalina).");
  if(tieneDefecto("adiccion_adrenalina")) avisos.push("Durante esta escena, +1 a la dificultad para resistir el Frenesí.");
  evento("alimentacion", {presa, puntos, adrenalina:!!adrenalina, de:antes, a:F.sangre, avisos});
  return {antes, ahora:F.sangre, avisos};
}
function recibirDano(niveles, tipo, fuente){
  niveles = Math.max(0, Math.floor(niveles));
  if(tipo === "C" && F.vampiro !== false) niveles = Math.floor(niveles/2);
  let estado = F.estado || "activo";
  for(let i=0;i<niveles;i++){
    if(F.salud.length >= SALUDV().length){ estado = tipo === "A" ? "muerte_definitiva" : (estado === "muerte_definitiva" ? estado : "letargo"); continue; }
    F.salud.push(tipo);
  }
  F.salud.sort((a,b) => "ALC".indexOf(a) - "ALC".indexOf(b));
  if(F.salud.length >= SALUDV().length && (F.sangre||0) === 0 && estado === "activo") estado = "letargo";   // Incapacitado y sin Sangre [pág. 121]
  F.estado = estado;
  evento("dano", {niveles, tipo, fuente, salud:[...F.salud], estado});
  return {niveles_aplicados:niveles, nivel:nivelSalud(), penalizacion:penalizacion(), estado};
}
function resolverDano(niveles, tipo, fuente){
  tipo = String(tipo).toUpperCase();
  if(!"CLAFS".includes(tipo) || tipo.length !== 1) throw new ReglaError("Tipo de daño: C, L, A, F (fuego) o S (sol).");
  const res = rasgo("resistencia"), fort = (F.disciplinas||{}).fortaleza || 0;
  const reserva = (tipo === "C" || tipo === "L") ? res + fort : fort;
  const abs = tirar(reserva, 6, {unosRestan:false});
  let pasan = Math.max(Math.floor(niveles) - abs.exitos, 0);
  if(tipo === "S" && tieneDefecto("debilidad_set") && pasan > 0) pasan += 2;
  const r = recibirDano(pasan, (tipo === "F" || tipo === "S") ? "A" : tipo, fuente);
  return {absorcion:abs, reserva_absorcion:reserva, niveles_brutos:niveles, ...r};
}
function curar(niveles){
  const curables = F.salud.filter(t => t === "C" || t === "L").length;
  if(!curables) throw new ReglaError(`${F.nombre} no tiene daño contundente ni letal para curar con Sangre.`);
  niveles = Math.min(Math.max(1, Math.floor(niveles)), curables);
  gastarSangre(niveles, "curación");
  for(let i=0;i<niveles;i++){ const idx = F.salud.map(t => "CL".includes(t)).lastIndexOf(true); F.salud.splice(idx,1); }
  evento("curacion", {niveles, salud:[...F.salud]});
  return {curados:niveles, nivel:nivelSalud()};
}
function usarPoder(disciplina, nivel, poder, sangre=0, fv=0){
  activo();
  const d = norm(disciplina), tiene = (F.disciplinas||{})[d] || 0;
  if(tiene < nivel) throw new ReglaError(`${F.nombre} tiene ${lab(d)} ${tiene}; «${poder}» requiere nivel ${nivel}.`);
  if(fv && F.fv < fv) throw new ReglaError(`«${poder}» cuesta ${fv} de Fuerza de Voluntad y ${F.nombre} tiene ${F.fv}.`);
  if(sangre && sangre > F.sangre) throw new ReglaError(`«${poder}» cuesta ${sangre} de Sangre y ${F.nombre} tiene ${F.sangre}.`);
  if(sangre){ gastarSangre(sangre, poder, d === "celeridad"); }
  if(fv){ F.fv -= fv; }
  evento("poder", {disciplina:d, nivel, poder, sangre, fv});
  return {ok:true, sangre:F.sangre, fv:F.fv};
}
/* ---------- inventario: lo que lleva encima y lo guardado en cada refugio ---------- */
const ENCIMA = "encima";
const refugios = () => INV.refugios || [];
const nombreLugar = l => l === ENCIMA ? "encima" : (refugios().find(r => r.id === l)?.nombre || l);
const encima = () => INV.items.filter(o => (o.lugar || ENCIMA) === ENCIMA);
function buscarObjeto(nombre, lista = INV.items){
  const b = norm(nombre);
  return lista.find(o => o.id === b || norm(o.nombre).includes(b) || b.includes(norm(o.nombre)));
}
// Para USAR algo, tiene que llevarlo encima. Si está guardado en un refugio, el motor lo dice.
function exigirObjeto(nombre){
  const o = buscarObjeto(nombre, encima());
  if(o) return o;
  const guardado = buscarObjeto(nombre);
  if(guardado) throw new ReglaError(`${F.nombre} no lleva encima «${guardado.nombre}»: está guardado en ${nombreLugar(guardado.lugar)}.`);
  throw new ReglaError(`${F.nombre} no tiene «${nombre}». Lleva encima: ${encima().map(x => x.nombre).join(", ") || "nada"}.`);
}
function buscarRefugio(nombre){
  const b = norm(nombre);
  const r = refugios().find(x => x.id === b || norm(x.nombre).includes(b) || b.includes(norm(x.nombre)));
  if(!r) throw new ReglaError(`${F.nombre} no tiene un refugio llamado «${nombre}». Sus refugios: ${refugios().map(x => x.nombre).join(", ") || "ninguno"}.`);
  return r;
}
function moverObjeto(nombre, destino){
  const o = buscarObjeto(nombre);
  if(!o) throw new ReglaError(`${F.nombre} no tiene «${nombre}».`);
  const a = destino === ENCIMA ? ENCIMA : buscarRefugio(destino).id;
  const de = o.lugar || ENCIMA;
  if(de === a) throw new ReglaError(`«${o.nombre}» ya está ${a === ENCIMA ? "encima" : "en " + nombreLugar(a)}.`);
  o.lugar = a;
  evento("objeto_movido", {objeto:o.id, de, a});
  return {objeto:o.nombre, de:nombreLugar(de), a:nombreLugar(a)};
}
/* ---------- dinero (en pesos, número entero) ---------- */
const pesos = n => new Intl.NumberFormat("es-AR", {style:"currency", currency:"ARS", maximumFractionDigits:0}).format(n || 0);
function cambiarDinero(cambio, motivo){
  cambio = Math.round(Number(cambio));
  if(!Number.isFinite(cambio) || cambio === 0) throw new ReglaError("El cambio de dinero tiene que ser un número distinto de cero.");
  const antes = Number(INV.dinero) || 0;
  if(antes + cambio < 0) throw new ReglaError(`${F.nombre} tiene ${pesos(antes)}; no le alcanza para gastar ${pesos(-cambio)}.`);
  INV.dinero = antes + cambio;
  evento("dinero", {cambio, motivo, de:antes, a:INV.dinero});
  return {antes, ahora:INV.dinero};
}
/* ---------- armas de fuego: recámara y cargador por separado ----------
   mecanismo: semiautomatica (la recámara se recarga sola al disparar),
              cerrojo / bombeo (hay que accionar el mecanismo; una bala por acción),
              revolver (tambor, sin recámara aparte). */
const MECANISMO = {semiautomatica:"Semiautomática", cerrojo:"Cerrojo", bombeo:"Bombeo", revolver:"Revólver"};
function normArma(o){
  if(o.tipo !== "arma_fuego") return o;
  o.mecanismo ||= "semiautomatica";
  if(o.mecanismo === "revolver"){
    if(o.tambor === undefined){ o.tambor = o.municion ?? 0; o.capacidad_tambor = o.capacidad ?? 6; }
    o.municion = o.tambor; o.capacidad = o.capacidad_tambor; return o;
  }
  if(o.recamara === undefined){ const m = o.municion ?? 0; o.recamara = m > 0 ? 1 : 0; o.cargador = m - o.recamara; o.capacidad_cargador = (o.capacidad ?? 16) - 1; }
  o.municion = o.recamara + o.cargador; o.capacidad = o.capacidad_cargador + 1;
  return o;
}
const manual = o => o.mecanismo === "cerrojo" || o.mecanismo === "bombeo";
function validarDisparo(o, balas){
  normArma(o);
  if(o.tipo !== "arma_fuego") throw new ReglaError(`«${o.nombre}» no es un arma de fuego.`);
  if(o.mecanismo === "revolver"){ if(o.tambor < balas) throw new ReglaError(`«${o.nombre}» tiene ${o.tambor} bala(s) en el tambor. Hay que recargar.`); return; }
  if(manual(o) && balas > 1) throw new ReglaError(`«${o.nombre}» es de ${o.mecanismo}: dispara una bala por acción.`);
  if(o.recamara + o.cargador < balas) throw new ReglaError(`«${o.nombre}» tiene ${o.recamara + o.cargador} bala(s) (recámara ${o.recamara ? "cargada" : "vacía"}, cargador ${o.cargador}). Hay que recargar.`);
}
function dispararArma(o, balas){
  validarDisparo(o, balas);
  const notas = [];
  if(o.mecanismo === "revolver"){ o.tambor -= balas; }
  else if(manual(o)){
    if(!o.recamara){ o.cargador--; o.recamara = 1; notas.push(o.mecanismo === "cerrojo" ? "acciona el cerrojo" : "acciona el bombeo"); }
    o.recamara = 0;   // queda vacía hasta volver a accionar
  } else {
    if(!o.recamara){ notas.push("monta el arma"); }
    const total = o.recamara + o.cargador - balas;
    o.recamara = total > 0 ? 1 : 0; o.cargador = Math.max(total - o.recamara, 0);
  }
  normArma(o);
  evento("disparo", {arma:o.id, balas, recamara:o.recamara ?? null, cargador:o.cargador ?? o.tambor, notas});
  return notas;
}
function estadoArma(o){
  normArma(o);
  if(o.mecanismo === "revolver") return `tambor ${o.tambor}/${o.capacidad_tambor}`;
  return `recámara ${o.recamara ? "cargada" : "vacía"}, cargador ${o.cargador}/${o.capacidad_cargador}`;
}
function recargar(arma){
  const o = normArma(exigirObjeto(arma));
  const c = encima().filter(x => x.tipo === "cargador" && x.para === o.id && (x.balas||0) > 0).sort((a,b) => b.balas - a.balas)[0];
  if(!c){
    const lejos = INV.items.find(x => x.tipo === "cargador" && x.para === o.id && (x.balas||0) > 0);
    throw new ReglaError(lejos ? `El cargador de repuesto está guardado en ${nombreLugar(lejos.lugar)}, no encima.` : `${F.nombre} no tiene cargadores de repuesto para «${o.nombre}».`);
  }
  if(o.mecanismo === "revolver"){   // carga rápida: se cambia el contenido del tambor
    const viejo = o.tambor; o.tambor = Math.min(c.balas, o.capacidad_tambor); c.balas = viejo; normArma(o);
    evento("recarga", {arma:o.id, tambor:o.tambor}); return {estado:estadoArma(o)};
  }
  // la bala de la recámara se queda en el arma; el cargador viejo sale con el resto
  const viejo = o.cargador; o.cargador = c.balas; c.balas = viejo;
  if(!o.recamara && o.mecanismo === "semiautomatica" && o.cargador > 0){ o.cargador--; o.recamara = 1; }
  c.nombre = c.nombre.replace(/ \(vacío\)$/,"") + (c.balas === 0 ? " (vacío)" : "");
  normArma(o);
  evento("recarga", {arma:o.id, recamara:o.recamara, cargador:o.cargador, cargador_viejo:viejo});
  return {estado:estadoArma(o)};
}
function reservaTirada(p){
  activo();
  const pen = penalizacion();
  if(pen === null) throw new ReglaError(`${F.nombre} está Incapacitado y no puede actuar.`);
  let reserva, titulo;
  if(p.rasgo){
    const r = norm(p.rasgo);
    reserva = rasgo(r);
    if(VIRT.includes(r)) reserva = Math.min(reserva, F.humanidad);
    if(r === "autocontrol") reserva = Math.min(reserva, F.sangre);
    titulo = lab(r);
  } else {
    const bono = bonoFisico(norm(p.atributo));
    reserva = rasgo(p.atributo) + (p.habilidad ? rasgo(p.habilidad) : 0) + bono.dados + pen;
    titulo = lab(norm(p.atributo)) + (p.habilidad ? " + " + lab(norm(p.habilidad)) : "") + (bono.dados ? " + " + bono.txt : "");
  }
  reserva = Math.max(0, reserva + (Number(p.modificador)||0));
  return {reserva, titulo, pen};
}

function pedidoCard(m){

async function resolverPedido(m, el){
  if(running){
    // El jugador quiere tirar: se corta la narración en curso sin ruido (la tirada dispara la continuación).
    running.silencioso = true; running.abort();
    const t0 = Date.now(); while(running && Date.now() - t0 < 4000) await wait(40);
    if(running){ sysMsg("Esperá a que el Narrador termine de escribir para tirar.", "", false); return; }
  }
  const btn = el.querySelector("button"), p = m.datos;
  const usarFV = !!el.querySelector(`#fv-${m.n}`)?.checked;
  let info, arma = null;
  try {
    info = reservaTirada(p);
    if(p.arma){
      arma = exigirObjeto(p.arma);
      validarDisparo(arma, Math.max(1, Number(p.balas)||1));
    }
    if(usarFV) gastarFV("éxito automático");
  } catch(e){ return regla(e); }
  btn.disabled = true;
  const row = el.querySelector(".droll"), res = el.querySelector(".res");
  row.innerHTML = Array.from({length:info.reserva},()=>'<div class="d10 spin">?</div>').join("");
  const t0 = Date.now();
  while(Date.now() - t0 < (reduce?80:800)){ row.querySelectorAll(".d10").forEach(x => x.textContent = d10()); await wait(70); }
  const espP = p.especialidad ? (espDe(norm(p.habilidad||"")) || espDe(norm(p.atributo||""))) : "";
  const t = tirar(info.reserva, Number(p.dificultad)||6, {auto: usarFV?1:0, esp: !!espP});
  t.titulo = p.motivo || info.titulo; t.reserva = info.reserva; t.quien = "jugador";
  row.innerHTML = "";
  let anul = anuladosT(t), unosA = anul;
  if(t.especialidad){ row.innerHTML = carasDados(t.dados, t.dificultad, anul, true); anul = 0; unosA = 0; }
  else for(const v of t.dados){ const dd = document.createElement("div"); dd.className = "d10 "+(v>=t.dificultad?"hit":v===1?"one":""); dd.textContent = v;
    if(anul > 0 && v >= t.dificultad){ anul--; dd.className = "d10"; const w = document.createElement("span"); w.className = "drw anulado"; w.title = "Éxito anulado por un 1"; w.appendChild(dd); row.appendChild(w); }
    else if(unosA > 0 && v === 1){ unosA--; dd.className = "d10"; const w = document.createElement("span"); w.className = "drw anulado"; w.appendChild(dd); row.appendChild(w); }
    else row.appendChild(dd); await wait(70); }
  if(t.automaticos){ const dd = document.createElement("div"); dd.className = "d10 auto"; dd.textContent = "FV"; row.appendChild(dd); }
  res.textContent = textoTirada(t); res.className = "res "+(t.resultado==="exito"?"good":"bad");
  el.querySelector(".dice-actions").remove();
  let notasArma = [];
  if(arma){ notasArma = dispararArma(arma, Math.max(1, Number(p.balas)||1)); guardarInv(); }
  evento("tirada", {titulo:t.titulo, reserva:t.reserva, dados:t.dados, dificultad:t.dificultad, neto:t.neto, resultado:t.resultado, fv:usarFV});
  guardarFicha(); refrescarCabecera();
  m.resuelto = true; m.resultado = t; guardarMsg(m);
  let extra = "";
  if(arma) extra = ` Disparo con ${arma.nombre}${notasArma.length?" ("+notasArma.join(", ")+")":""}: daño base ${arma.dano}; dados de daño si acierta: ${arma.dano + Math.max(t.neto-1,0)}. Ahora: ${estadoArma(arma)}.`;
  await wait(400);
  narrar(`[Resultado de la tirada «${t.titulo}»: ${t.reserva} dados a dificultad ${t.dificultad} → [${t.dados.join(", ")}]${t.automaticos?" + 1 éxito automático por Fuerza de Voluntad":""}${t.especialidad?" (con Especialidad: cada 10 vale dos)":""} = ${textoTirada(t)}.${extra}]`, {oculto:true});
}

   Narrador con IA
   ===================================================================== */
const INSTRUCCIONES = `Sos el Narrador de una crónica de Vampiro: La Mascarada 20º Aniversario (V20) ambientada en Buenos Aires. Hablás en castellano rioplatense, en segunda persona y en presente ("Caminás por Defensa…").

CÓMO NARRAR
- Respuestas cortas: 1 a 3 párrafos breves. Atmósfera concreta de Buenos Aires de noche (lugares reales, olores, sonidos). Los PNJ hablan con su propia voz; el diálogo va entre «comillas latinas».
- FIDELIDAD A LA ACCIÓN (la regla más importante): narrá únicamente lo que el jugador dijo que hace, a la misma escala. Si dice que sale a la calle, está en la puerta o la vereda; no camina por el barrio ni va a ningún lado. No lo mudes de lugar ni saltes tiempo más allá de lo que cuesta lo que dijo (el reloj sí avanza con sus acciones, ver RELOJ). No le inventes pensamientos, emociones, sensaciones ni decisiones (nada de «sentís frío», «la sed te empuja», «decidís…»).
- Si lo que dijo admite dos lecturas, tomá la más chica y quieta. Si la diferencia importa de verdad, preguntale en una línea qué quiso decir en vez de elegir por él.
- Describí lo que pasa alrededor y cómo reaccionan los PNJ, y parate en el primer momento en que al jugador le toque decidir. Que el mundo se mueva (alguien se acerca, algo suena) sí; que el personaje actúe por su cuenta, no.
- Las opciones de sugerir_opciones son atajos, no un guion: nunca las des por elegidas ni empujes la escena hacia ellas.
- Al terminar cada respuesta llamá a sugerir_opciones con 2 a 4 acciones posibles cortas (el jugador puede escribir cualquier otra cosa).
- RELOJ: toda acción gasta tiempo (una charla corta 5 a 15 minutos, una caminata corta 10 a 20, una comida o un trámite 20 a 40). Llevá la cuenta y, cuando se acumulen unos 10 minutos o más desde la última hora fijada, o cambie el lugar, llamá a actualizar_escena con la hora nueva (formato 24 h, p. ej. «02:40») y un resumen corto. No hace falta que el jugador lo pida. Las herramientas son invisibles: JAMÁS escribas «dejé la hora en…», «actualicé la escena» ni nada parecido, y no agregues un mensaje aparte después de usarlas. Si querés marcar el paso del tiempo, hacelo de vez en cuando dentro de la propia narración («pasa media hora», «ya es de madrugada»), sin decir la hora exacta. Esto solo mueve el reloj: no le cambia el lugar ni le hace hacer nada que no dijo.

REGLAS (el motor de reglas es la única fuente de verdad)
- Nunca inventes números, tiradas, Sangre, daño ni objetos. Todo cambio pasa por las herramientas.
- Antes de que el personaje use un objeto, llamá a usar_objeto: si no lo tiene o lo dejó guardado en un refugio, el motor lo rechaza; narrá la corrección con amabilidad. Solo puede usar lo que lleva encima.
- Si deja o retira cosas en un refugio, usá inventario con guardar o retirar (solo si está físicamente en ese refugio). Si paga o cobra, usá dinero con el monto en pesos.
- Antes de usar una Disciplina, llamá a usar_poder con su nivel y costo. Si no la tiene, no ocurre.
- Si la acción del jugador tiene un resultado incierto, pedí una tirada con tirada_jugador y TERMINÁ tu mensaje describiendo la tensión del momento: el jugador va a tirar y vas a recibir el resultado como un mensaje entre [corchetes]. No narres el desenlace antes del resultado.
- Las tiradas de PNJ las hacés con tirada_pnj (oculta=true si el jugador no debería ver el resultado).
- Usá las dificultades de V20 (6 por defecto). Reserva = Atributo + Habilidad; el motor resta las penalizaciones por heridas solo.
- Si el personaje se alimenta, usá alimentarse (máximo 3 puntos por turno; humano = 10 puntos; tomar 2 es seguro, la mitad lo manda al hospital, todo lo mata). Si el motor devuelve FRENESÍ, narralo.
- Si el personaje recibe daño, usá danio_al_personaje con los niveles que logró el atacante; el motor tira la absorción.
- Antes de que el personaje cometa un acto que pueda costarle Humanidad (Humanidad actual o menor en la jerarquía de pecados), AVISALE al jugador y dejalo reconsiderar. Si lo hace igual, pedí tirada_jugador con rasgo "conciencia", dificultad 8 y sin_fv=true.
- Mostrá apoyo visual con mostrar_visual cuando aparece un PNJ importante por primera vez o se llega a un lugar significativo (no en cada mensaje).
- Si el personaje aprende algo duradero (un contacto, un dato, una pista), llamá a anotar.

SECRETOS
- Solo sabés lo que figura abajo. No reveles información que el personaje no conoce, salvo que la descubra en la escena.
- Si el jugador toca algo cuya verdad no está abajo (un misterio de su pasado o de su Sire, lo que esconde un PNJ, un objeto, un PNJ nuevo importante o una amenaza sin explicar), NO la inventes: llamá a consultar_director con la pregunta. El Director te responde en el momento con la verdad o la decisión; usala con coherencia y revelá solo lo que el personaje descubra en la escena.
- Seguí la instrucción del Director para esta noche: es lo que se mueve en la crónica. No la fuerces: si el jugador va por otro lado, dejá que las consecuencias lo alcancen.
`;

function contexto(){
  const [maximo, reserva, porTurno] = limites();
  const ficha = {
    nombre:F.nombre, clan:F.clan, generacion:F.generacion, concepto:F.concepto, naturaleza:F.naturaleza, conducta:F.conducta,
    descripcion:F.descripcion, atributos:F.atributos, habilidades:F.habilidades, disciplinas:F.disciplinas, poderes:F.poderes,
    trasfondos:F.trasfondos, trasfondos_detalle:F.trasfondos_detalle||{}, especialidades:F.especialidades||{}, trasfondos_notas:Object.fromEntries(Object.entries(F.trasfondos_notas||{}).map(([t,l]) => [t, l.map(n => n.texto)])), virtudes:F.virtudes, humanidad:F.humanidad,
    fuerza_de_voluntad:`${F.fv}/${F.fv_max}`, sangre:`${F.sangre}/${reserva} (gasto máx. ${porTurno} por turno)`,
    hambriento:hambriento(), salud:nivelSalud(), penalizacion_heridas:penalizacion(), estado:F.estado||"activo",
    meritos:(F.meritos||[]).map(d => d.nombre+": "+d.efecto), defectos:(F.defectos||[]).map(d => d.nombre+": "+d.efecto), criterios_de_mesa:F.criterios_texto||[]
  };
  const desc = o => o.nombre + (o.tipo==="arma_fuego"?` (${MECANISMO[normArma(o).mecanismo]}; ${estadoArma(o)}; daño ${o.dano}, cadencia ${o.cadencia})`:"") + (o.tipo==="cargador"?` (${o.balas} balas)`:"") + (o.nota?` — ${o.nota}`:"");
  const inv = encima().map(desc);
  const guardado = refugios().map(r => `${r.nombre}${r.descripcion?" ("+r.descripcion+")":""}${r.notas?" [notas del jugador: "+String(r.notas).slice(0,240)+"]":""}: ${INV.items.filter(o => o.lugar === r.id).map(desc).join("; ") || "nada guardado"}`);
  return `${INSTRUCCIONES}

=== PERSONAJE (ficha actual, fuente de verdad) ===
${JSON.stringify(ficha)}

=== LO QUE LLEVA ENCIMA (solo esto puede usar) ===
${inv.map(x => "- "+x).join("\n") || "- (nada)"}
Dinero en efectivo: ${pesos(INV.dinero)}

=== SUS REFUGIOS Y LO QUE HAY GUARDADO ===
${guardado.map(x => "- "+x).join("\n") || "- (sin refugios)"}

=== LO QUE EL PERSONAJE SABE ===
${(CON.hechos||[]).map(h => "- "+h.texto).join("\n")}

=== ESCENA ACTUAL ===
Noche ${MUNDO.noche ?? "?"} · ${MUNDO.hora || "hora sin definir"} · ${MUNDO.lugar || "lugar sin definir"}
${MUNDO.resumen ? "Lo que pasó hasta ahora esta noche: "+MUNDO.resumen : ""}

=== HISTORIA PREVIA ===
${MUNDO.historia || ""}
${cronicaCorta()}

${bloqueDirector()}`;
}

function turnos(){
  const out = [{role:"user", content:contexto()}];
  const push = (role, content) => {
    if(!content) return;
    const last = out[out.length-1];
    if(last.role === role) last.content += "\n\n" + content; else out.push({role, content});
  };
  const recientes = MSGS.filter(m => m.n > (MUNDO.cierre_n || 0)).slice(-24);
  for(const m of recientes){
    if(m.rol === "narrador") push("assistant", m.texto);
    else if(m.rol === "jugador") push("user", m.oculto ? m.texto : "Jugador: "+m.texto);
    else if(m.rol === "sistema" && m.clase !== "err") push("user", "[Sistema: "+m.texto+"]");
    else if(m.rol === "pedido" && m.resuelto) push("user", `[Tirada «${m.resultado.titulo}»: ${textoTirada(m.resultado)}]`);
    else if(m.rol === "pedido") push("user", `[Tirada pedida pendiente: ${m.datos.motivo}]`);
    else if(m.rol === "dados") push("user", `[Tirada del Narrador «${m.datos.titulo}»: ${textoTirada(m.datos)}]`);
  }
  if(out[out.length-1].role !== "user") out.push({role:"user", content:"[Continuá la escena.]"});
  // Recordatorio pegado al final del pedido: lo último que se lee es lo que más pesa.
  out[out.length-1].content += "\n\n[Recordatorio del Director: narrá solo lo que el jugador acaba de decir que hace, a su misma escala; no lo muevas de lugar, no saltes tiempo de más (el reloj sí sigue el costo de lo que hace) ni le inventes pensamientos o sensaciones. Parate en la primera decisión que le toque tomar.]";
  return out;
}

  tool("consultar_director", "Consulta al Director cuando la escena toca algo cuya verdad no tenés (un misterio, lo que esconde un PNJ, un PNJ nuevo importante, el origen de algo). Devuelve la verdad o la decisión para que sigas narrando con coherencia.",
    {type:"object", properties:{pregunta:{type:"string"}}, required:["pregunta"]},
